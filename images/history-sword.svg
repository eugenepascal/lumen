<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#3F4A3A"/>
    <stop offset="1" stop-color="#232B21"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="38%" r="60%">
    <stop stop-color="#F1D493" stop-opacity=".45"/>
    <stop offset="1" stop-color="#F1D493" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F3EEDD"/>
    <stop offset="1" stop-color="#B8AE8E"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F6E3B4"/>
    <stop offset="1" stop-color="#C9A876"/>
  </linearGradient>
</defs>
<rect width="900" height="900" fill="url(#bg)"/>
<circle cx="450" cy="360" r="320" fill="url(#glow)"/>
<g transform="translate(450,400) rotate(-45)">
  <rect x="-24" y="-260" width="48" height="330" rx="10" fill="url(#steel)"/>
  <rect x="-90" y="60" width="180" height="34" rx="10" fill="url(#gold)"/>
  <rect x="-18" y="90" width="36" height="120" rx="10" fill="url(#gold)"/>
</g>
<circle cx="450" cy="382" r="190" fill="none" stroke="#F6E3B4" stroke-opacity=".28" stroke-width="3"/>
</svg>
