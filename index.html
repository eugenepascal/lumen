  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = loading;
  btn.textContent = loading ? 'Un instant…' : (AUTH_MODE_TAB==='login' ? 'Se connecter' : 'Créer mon compte');
}
function wireAuthScreen(){
  document.getElementById('auth-tab-login').onclick = ()=>{
    AUTH_MODE_TAB='login'; clearAuthError();
    document.getElementById('auth-tab-login').classList.add('active');
    document.getElementById('auth-tab-signup').classList.remove('active');
    document.getElementById('auth-submit-btn').textContent = 'Se connecter';
  };
  document.getElementById('auth-tab-signup').onclick = ()=>{
    AUTH_MODE_TAB='signup'; clearAuthError();
    document.getElementById('auth-tab-signup').classList.add('active');
    document.getElementById('auth-tab-login').classList.remove('active');
    document.getElementById('auth-submit-btn').textContent = 'Créer mon compte';
  };
  document.getElementById('auth-password-toggle').onclick = ()=>{
    const input = document.getElementById('auth-password');
    const btn = document.getElementById('auth-password-toggle');
    if(input.type === 'password'){ input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
  };
  document.getElementById('auth-submit-btn').onclick = async ()=>{
    clearAuthError();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(!email || !password){ authError("Merci de renseigner un email et un mot de passe."); return; }
    if(!FIREBASE_READY){ authError("La connexion à Firebase n'est pas disponible dans cet environnement."); return; }
    setAuthSubmitLoading(true);
    try{
      if(AUTH_MODE_TAB==='login'){
        await fbAuth.signInWithEmailAndPassword(email, password);
      } else {
        await fbAuth.createUserWithEmailAndPassword(email, password);
      }
    }catch(e){
      if(fbAuth.currentUser){
        CURRENT_USER = fbAuth.currentUser;
        window.storage = makeFirestoreShim(CURRENT_USER.uid);
        document.getElementById('auth-screen').classList.add('hidden');
        setAuthSubmitLoading(false);
        startApp();
        return;
      }
      authError(friendlyAuthError(e)); showAuthResetOption();
    }
    setAuthSubmitLoading(false);
  };
  document.getElementById('auth-google-btn').onclick = async ()=>{
    clearAuthError();
    if(!FIREBASE_READY){ authError("La connexion à Firebase n'est pas disponible dans cet environnement."); return; }
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      await fbAuth.signInWithPopup(provider);
    }catch(e){
      if(fbAuth.currentUser){
        // La connexion Google a en réalité réussi ; seule l'écriture locale a échoué.
        CURRENT_USER = fbAuth.currentUser;
        window.storage = makeFirestoreShim(CURRENT_USER.uid);
        document.getElementById('auth-screen').classList.add('hidden');
        startApp();
        return;
      }
      if(e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request'){
        authError("La fenêtre Google a été bloquée par le navigateur. Autorisez les popups pour ce site, ou utilisez la connexion par email.");
      } else if(e.code !== 'auth/popup-closed-by-user'){
        authError(friendlyAuthError(e));
        showAuthResetOption();
      }
    }
  };
  document.getElementById('auth-forgot-btn').onclick = async ()=>{
    clearAuthError();
    const email = document.getElementById('auth-email').value.trim();
    if(!email){ authError("Renseignez d'abord votre adresse email ci-dessus, puis touchez à nouveau ce lien."); return; }
    if(!FIREBASE_READY){ authError("La connexion à Firebase n'est pas disponible dans cet environnement."); return; }
    try{
      await fbAuth.sendPasswordResetEmail(email);
      authError("Un email pour réinitialiser votre mot de passe vient de vous être envoyé.");
    }catch(e){ authError(friendlyAuthError(e)); showAuthResetOption(); }
  };
  document.getElementById('auth-guest-btn').onclick = ()=>{
    window.storage = NATIVE_STORAGE;
    CURRENT_USER = null;
    document.getElementById('auth-screen').classList.add('hidden');
    startApp();
  };
}

async function initAuthPersistence(){
  const P = firebase.auth.Auth.Persistence;
  try{
    await fbAuth.setPersistence(P.LOCAL);
    return 'LOCAL';
  }catch(e1){
    console.warn('Persistance LOCAL (IndexedDB) indisponible, repli sur SESSION', e1);
    try{
      await fbAuth.setPersistence(P.SESSION);
      return 'SESSION';
    }catch(e2){
      console.warn('Persistance SESSION indisponible, repli sur NONE', e2);
      try{
        await fbAuth.setPersistence(P.NONE);
        return 'NONE';
      }catch(e3){
        console.warn('Aucun mode de persistance disponible', e3);
        return null;
      }
    }
  }
}

async function startAuthFlow(){
  wireAuthScreen();
  if(!FIREBASE_READY){
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('auth-form-wrap').style.display = 'block';
    authError("Firebase n'a pas pu s'initialiser ici — vous pouvez continuer sans compte.");
    return;
  }
  const persistenceMode = await initAuthPersistence();
  if(persistenceMode === 'SESSION'){
    showToast("Mode de connexion simplifié activé (vous devrez vous reconnecter à chaque nouvelle visite, mais vos données restent bien sauvegardées).");
  } else if(persistenceMode === 'NONE'){
    showToast("Stockage du navigateur indisponible : la connexion ne survivra pas au rechargement de la page.");
  }
  let resolved = false;
  const timeoutId = setTimeout(()=>{
    if(resolved) return;
    resolved = true;
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('auth-form-wrap').style.display = 'block';
    authError("La connexion met trop de temps à répondre (souvent un souci de stockage du navigateur). Vous pouvez réessayer, réinitialiser la connexion ci-dessous, ou continuer sans compte.");
    showAuthResetOption();
  }, 7000);
  try{
    fbAuth.onAuthStateChanged(
      (user)=>{
        if(resolved) return;
        resolved = true;
        clearTimeout(timeoutId);
        if(user){
          CURRENT_USER = user;
          window.storage = makeFirestoreShim(user.uid);
          document.getElementById('auth-screen').classList.add('hidden');
          startApp();
        } else {
          document.getElementById('auth-loading').style.display = 'none';
          document.getElementById('auth-form-wrap').style.display = 'block';
        }
      },
      (err)=>{
        if(resolved) return;
        resolved = true;
        clearTimeout(timeoutId);
        console.error('onAuthStateChanged error', err);
        document.getElementById('auth-loading').style.display = 'none';
        document.getElementById('auth-form-wrap').style.display = 'block';
        authError("Problème de connexion au service d'authentification (" + (err.message||err) + "). Réessayez, réinitialisez la connexion, ou continuez sans compte.");
        showAuthResetOption();
      }
    );
  }catch(err){
    clearTimeout(timeoutId);
    resolved = true;
    console.error('startAuthFlow error', err);
    document.getElementById('auth-loading').style.display = 'none';
    document.getElementById('auth-form-wrap').style.display = 'block';
    authError("Erreur d'initialisation de la connexion. Réinitialisez la connexion ci-dessous ou continuez sans compte.");
    showAuthResetOption();
  }
}
function showAuthResetOption(){
  if(document.getElementById('auth-reset-btn')) return;
  const btn = document.createElement('button');
  btn.id = 'auth-reset-btn';
  btn.className = 'auth-forgot-link';
  btn.textContent = '🔄 Réinitialiser la connexion (efface le cache de connexion local)';
  btn.onclick = async ()=>{
    try{
      if(window.indexedDB && indexedDB.databases){
        const dbs = await indexedDB.databases();
        await Promise.all(dbs.map(d=> new Promise(res=>{
          const req = indexedDB.deleteDatabase(d.name);
          req.onsuccess = req.onerror = req.onblocked = res;
        })));
      } else if(window.indexedDB){
        await new Promise(res=>{
          const req = indexedDB.deleteDatabase('firebaseLocalStorageDb');
          req.onsuccess = req.onerror = req.onblocked = res;
        });
      }
    }catch(e){ console.warn('reset indexedDB failed', e); }
    window.location.reload();
  };
  document.getElementById('auth-form-wrap').appendChild(btn);
}

function renderCompte(){
  let html = `<h2 class="section-title">👤 Mon compte</h2>
    <div class="card">
      <label style="font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;">Comment souhaitez-vous qu'on vous appelle ?</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="compte-name-input" value="${USER_NAME||''}" placeholder="Votre prénom">
        <button class="btn btn-gold btn-sm" id="compte-name-save">Enregistrer</button>
      </div>
    </div>`;
  if(CURRENT_USER){
    html += `<div class="card" id="account-info">
      <p class="entry-detail-text">Connecté(e) en tant que :<br><b>${CURRENT_USER.email}</b></p>
      <p class="section-desc">Vos prières, votre journal et votre progression sont sauvegardés sur ce compte et retrouvables sur n'importe quel appareil où vous vous reconnectez.</p>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Se déconnecter</button>
    </div>`;
  } else {
    html += `<div class="card">
      <p class="entry-detail-text">Vous utilisez Lumen sans compte : vos données restent uniquement sur cet appareil, dans ce navigateur.</p>
      <p class="section-desc">Créez un compte pour retrouver vos données sur un autre appareil.</p>
      <button class="btn btn-primary btn-sm" id="login-now-btn">Créer un compte / Se connecter</button>
    </div>`;
  }
  document.getElementById('screen').innerHTML = html;
  document.getElementById('compte-name-save').onclick = async ()=>{
    const val = document.getElementById('compte-name-input').value.trim();
    USER_NAME = val.slice(0, 30);
    await savePrefs();
    showToast('Prénom mis à jour ✦');
  };
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.onclick = async ()=>{ await fbAuth.signOut(); window.location.reload(); };
  const loginNowBtn = document.getElementById('login-now-btn');
  if(loginNowBtn) loginNowBtn.onclick = ()=> window.location.reload();
}

/* ---- reused helper functions (liturgical calendar) ---- */
function getEasterDate(year){
  const a = year % 19, b = Math.floor(year/100), c = year % 100;
  const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c/4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month-1, day);
}
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function adventStart(year){
  const d = new Date(year, 10, 30);
  while(d.getDay() !== 0) d.setDate(d.getDate()-1);
  return d;
}
function formatDateFR(date){
  return date.toLocaleDateString("fr-FR", {day:"numeric", month:"long", year:"numeric"});
}

      {name:"Saül", dates:"v. 1050 - 1010 av. J.-C.", tag:"mitige", avatar:"👑", ref:"1 Samuel 9 à 31", link:"1 Samuel 9-31", summary:"Premier roi d'Israël, désigné par tirage au sort puis oint en secret par le prophète Samuel, après que le peuple ait réclamé un roi comme les autres nations. Il remporte d'abord des victoires contre les Ammonites et les Philistins, mais commet plusieurs actes de désobéissance : il offre lui-même un sacrifice réservé aux prêtres, puis épargne un roi ennemi contre l'ordre reçu. Samuel lui annonce alors que la royauté lui sera retirée. Rongé par la jalousie envers David, dont la popularité grandit après sa victoire sur Goliath, il tente à plusieurs reprises de le faire tuer et le poursuit pendant des années. Vers la fin de sa vie, désespéré, il consulte une nécromancienne malgré l'interdiction qu'il avait lui-même imposée. Il meurt avec ses fils au combat contre les Philistins sur le mont Guilboa."},
      {name:"David", dates:"v. 1010 - 970 av. J.-C.", tag:"mitige", avatar:"🎵", ref:"1 Samuel 16 à 1 Rois 2:11 ; 1 Chroniques 10 à 29", link:"2 Samuel 1-24", summary:"Berger de Bethléem, plus jeune fils de Jessé, il est oint en secret par Samuel alors que Saül règne encore. Il se fait connaître en battant le géant philistin Goliath, puis sert à la cour de Saül avant de devenir la cible de sa jalousie et de fuir pendant plusieurs années. À la mort de Saül, il est proclamé roi, d'abord sur Juda puis sur l'ensemble d'Israël. Il conquiert Jérusalem et en fait sa capitale politique et religieuse, y installant l'arche de l'alliance. Guerrier habile, il étend les frontières du royaume et reçoit de Dieu la promesse d'une dynastie sans fin. Son règne est aussi marqué par une faute grave : il fait venir Bethsabée, épouse d'un de ses soldats, et organise la mort de celui-ci pour dissimuler l'adultère, ce que le prophète Nathan vient dénoncer. Il traverse ensuite des crises familiales et politiques, dont la révolte de son fils Absalom."},
      {name:"Salomon", dates:"v. 970 - 931 av. J.-C.", tag:"mitige", avatar:"🦉", ref:"1 Rois 1 à 11 ; 2 Chroniques 1 à 9", link:"1 Kings 1-11", summary:"Fils de David et de Bethsabée, il accède au trône après une lutte de succession face à un demi-frère. Dès le début de son règne, il demande à Dieu la sagesse plutôt que la richesse ou la victoire militaire, une demande exaucée de façon spectaculaire, illustrée notamment par son jugement entre deux femmes se disputant un enfant. Il fait construire le premier Temple de Jérusalem, un projet initié par David mais qu'il mène à terme, ainsi qu'un palais royal somptueux. Son règne connaît une grande prospérité économique et diplomatique, symbolisée par la visite de la reine de Saba. Cependant, ses nombreuses alliances matrimoniales avec des princesses étrangères l'amènent à tolérer, puis à pratiquer, des cultes idolâtres. À sa mort, les tensions accumulées sous son règne, notamment fiscales, provoquent la scission du royaume entre ses successeurs."}
    ]
  },

  {
    id:"royaume-nord",
    title:"Le royaume du Nord, Israël",
    desc:"Capitale Samarie, dix-neuf rois sur environ deux siècles, tous jugés infidèles par le texte biblique en raison du culte des veaux d'or institué dès le premier roi.",
    entries:[
      {name:"Jéroboam Ier", dates:"v. 931 - 910", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 11:26 à 14:20", link:"1 Kings 11-14", summary:"Ancien fonctionnaire de Salomon, il reçoit du prophète Ahija l'annonce qu'il régnera sur dix des douze tribus en punition de l'idolâtrie de Salomon. Après la mort de celui-ci, le refus de son fils Roboam d'alléger les charges du peuple provoque la révolte des tribus du Nord, qui proclament Jéroboam roi. Craignant que les pèlerinages au Temple de Jérusalem ne ramènent le peuple sous l'autorité de Juda, il installe deux veaux d'or à Béthel et à Dan comme lieux de culte alternatifs, et institue un clergé et des fêtes parallèles à ceux de Jérusalem. Cette initiative est présentée comme la faute fondatrice du royaume du Nord, reprise par tous les rois suivants. Son règne est marqué par des conflits répétés avec Juda."},
      {name:"Nadab", dates:"v. 910 - 909", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 15:25-31", link:"1 Kings 15:25-31", summary:"Fils et successeur de Jéroboam, il poursuit les pratiques religieuses de son père. Alors qu'il assiège une ville philistine, il est assassiné par Baesha, qui s'empare du trône et extermine toute la descendance de Jéroboam, accomplissant l'annonce prophétique faite contre cette maison."},
      {name:"Baesha", dates:"v. 909 - 886", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 15:32 à 16:7", link:"1 Kings 15:32-16:7", summary:"Après avoir éliminé la dynastie de Jéroboam, il s'installe sur le trône mais reproduit les mêmes pratiques idolâtres. Son règne est marqué par un conflit prolongé avec le royaume de Juda, notamment des travaux fortifiés à la frontière qui sont ensuite démantelés lorsque le roi de Juda s'allie avec la Syrie contre lui. Un prophète lui annonce à son tour la destruction de sa propre dynastie en raison de son infidélité."},
      {name:"Éla", dates:"v. 886 - 885", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 16:8-14", link:"1 Kings 16:8-14", summary:"Fils de Baesha, il règne peu de temps avant d'être assassiné alors qu'il est ivre, par un de ses officiers de char, Zimri, qui extermine également toute sa famille."},
      {name:"Zimri", dates:"v. 885", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 16:15-20", link:"1 Kings 16:15-20", summary:"Après son coup d'État, il ne parvient pas à asseoir son autorité : l'armée proclame un autre général, Omri, qui assiège la capitale. Voyant la situation perdue après seulement sept jours de règne, il met le feu au palais royal et périt dans l'incendie."},
      {name:"Omri", dates:"v. 885 - 874", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 16:21-28", link:"1 Kings 16:21-28", summary:"Il doit d'abord l'emporter sur un rival avant de s'imposer comme roi. Il achète une colline et y fonde la ville de Samarie, qui devient la nouvelle capitale du royaume du Nord pour le reste de son existence, un choix politique et stratégique durable. Son règne, bien que militairement significatif au point d'être mentionné dans des inscriptions assyriennes, est jugé sévèrement par le texte biblique en raison de la poursuite du culte des veaux d'or."},
      {name:"Achab", dates:"v. 874 - 853", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 16:29 à 22:40", link:"1 Kings 16:29-22:40", summary:"Fils d'Omri, il épouse Jézabel, princesse phénicienne, et introduit sous son influence le culte de Baal à une échelle nouvelle, jusqu'à construire un temple dédié à cette divinité à Samarie. Il entre en confrontation directe avec le prophète Élie, notamment lors d'un défi organisé au mont Carmel où le feu du ciel désigne le vrai Dieu face aux prophètes de Baal. Son règne est aussi marqué par l'épisode de la vigne de Naboth, où Jézabel organise un procès inique pour lui permettre de s'approprier une terre convoitée, ce qui lui vaut une sévère condamnation prophétique. Il meurt au combat contre les Syriens, touché par une flèche tirée au hasard."},
      {name:"Achazia", dates:"v. 853 - 852", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 22:52 à 2 Rois 1:18", link:"2 Kings 1", summary:"Fils d'Achab, son règne bref est marqué par un incident où, blessé après une chute, il envoie consulter un dieu étranger plutôt que le Dieu d'Israël, ce que le prophète Élie condamne en lui annonçant sa mort prochaine, qui survient effectivement peu après."},
      {name:"Joram", dates:"v. 852 - 841", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 3:1 à 9:26", link:"2 Kings 3-9", summary:"Frère d'Achazia, il poursuit une politique religieuse un peu moins marquée par le culte de Baal, mais reste jugé infidèle. Son règne est marqué par une campagne militaire contre Moab et par plusieurs interventions du prophète Élisée, dont la guérison du général syrien Naaman. Il est finalement tué par Jéhu, qui met fin à toute la dynastie d'Omri dans un coup d'État sanglant."},
      {name:"Jéhu", dates:"v. 841 - 814", avatar:"🏛️", tag:"mitige", ref:"2 Rois 9:1 à 10:36", link:"2 Kings 9-10", summary:"Officier de l'armée, il est oint roi en secret par un envoyé du prophète Élisée avec pour mission d'exterminer la maison d'Achab. Il accomplit cette tâche avec une violence rapide et systématique, faisant tuer Joram, Jézabel, ainsi que les autres descendants d'Achab et les prêtres de Baal. Malgré ce zèle contre le culte de Baal, il ne renonce pas aux veaux d'or instaurés par Jéroboam, ce qui limite l'appréciation positive de son règne."},
      {name:"Joachaz", dates:"v. 814 - 798", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 13:1-9", link:"2 Kings 13:1-9", summary:"Fils de Jéhu, son règne est marqué par une forte pression militaire de la Syrie qui réduit considérablement les forces armées d'Israël, jusqu'à ce qu'il implore l'aide de Dieu et obtienne un répit relatif."},
      {name:"Joas", dates:"v. 798 - 782", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 13:10-25", link:"2 Kings 13:10-25", summary:"Fils de Joachaz, il rend visite au prophète Élisée sur son lit de mort et reçoit de lui une prophétie de victoires militaires contre la Syrie, qu'il obtient effectivement à trois reprises. Il affronte aussi militairement le roi de Juda Amatsia et remporte la victoire."},
      {name:"Jéroboam II", dates:"v. 793 - 753", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 14:23-29", link:"2 Kings 14:23-29", summary:"Petit-fils de Jéhu, il règne pendant la période la plus longue et la plus prospère du royaume du Nord, étendant les frontières et développant le commerce. Cette prospérité s'accompagne cependant de fortes inégalités sociales, dénoncées vigoureusement par les prophètes Amos et Osée, actifs durant son règne."},
      {name:"Zacharie", dates:"v. 753", tag:"mauvais", avatar:"🌙", ref:"2 Rois 15:8-12", link:"2 Kings 15:8-12", summary:"Dernier roi de la dynastie de Jéhu, conformément à la promesse faite à cette maison de régner sur quatre générations, il est assassiné publiquement après seulement six mois de règne par Shalloum."},
      {name:"Shalloum", dates:"v. 752", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 15:13-15", link:"2 Kings 15:13-15", summary:"Après avoir assassiné Zacharie, il ne règne qu'un mois avant d'être tué à son tour par Menahem, dans une période de grande instabilité politique."},
      {name:"Menahem", dates:"v. 752 - 742", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 15:16-22", link:"2 Kings 15:16-22", summary:"Il s'empare du pouvoir avec une grande brutalité, y compris envers une ville qui lui refuse ses portes. Pour préserver son trône face à la menace assyrienne montante, il paie un lourd tribut au roi d'Assyrie, prélevé sur la population, ce qui commence à placer le royaume sous dépendance étrangère."},
      {name:"Peqachia", dates:"v. 742 - 740", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 15:23-26", link:"2 Kings 15:23-26", summary:"Fils de Menahem, il poursuit une politique similaire mais est rapidement assassiné par un de ses officiers, Péqach, dans le palais royal."},
      {name:"Péqach", dates:"v. 740 - 732", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 15:27-31", link:"2 Kings 15:27-31", summary:"Il s'allie avec le roi de Syrie contre Juda et l'Assyrie, ce qui provoque une intervention militaire assyrienne qui lui fait perdre une large partie du territoire du royaume du Nord, notamment en Galilée. Il est finalement assassiné par Osée."},
      {name:"Osée", dates:"v. 732 - 722", tag:"mauvais", avatar:"💍", ref:"2 Rois 17:1-41", link:"2 Kings 17", summary:"Dernier roi d'Israël, il monte sur le trône après avoir assassiné son prédécesseur. Vassal de l'Assyrie, il tente une alliance secrète avec l'Égypte pour s'affranchir de cette tutelle, ce qui provoque une réaction assyrienne : Samarie est assiégée pendant trois ans avant de tomber en 722 av. J.-C. Une partie importante de la population est déportée vers d'autres régions de l'empire assyrien, marquant la fin définitive du royaume du Nord."}
    ]
  },
  {
    id:"royaume-sud",
    title:"Le royaume du Sud, Juda",
    desc:"Capitale Jérusalem, dynastie davidique continue jusqu'à l'exil, avec un mélange de rois fidèles et infidèles selon le récit biblique.",
    entries:[
      {name:"Roboam", dates:"v. 931 - 913", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 12:1-24 ; 14:21-31 ; 2 Chroniques 10 à 12", link:"1 Kings 12", summary:"Fils et successeur de Salomon, il se rend à Sichem pour être reconnu roi par les tribus du Nord, mais refuse d'alléger les lourdes charges imposées sous le règne de son père, suivant le conseil de jeunes conseillers plutôt que celui des anciens. Ce refus provoque la sécession immédiate des dix tribus du Nord, qui se rallient à Jéroboam, ne laissant à Roboam que Juda et Benjamin. Il doit ensuite affronter une invasion égyptienne qui pille le Temple de Jérusalem."},
      {name:"Abiam", dates:"v. 913 - 911", avatar:"🏛️", tag:"mauvais", ref:"1 Rois 15:1-8 ; 2 Chroniques 13", link:"1 Kings 15:1-8", summary:"Fils de Roboam, son court règne est marqué par un conflit militaire avec Jéroboam qu'il remporte grâce à une intervention jugée providentielle, mais il poursuit par ailleurs les pratiques religieuses critiquées de son père."},
      {name:"Asa", dates:"v. 911 - 870", avatar:"🏛️", tag:"bon", ref:"1 Rois 15:9-24 ; 2 Chroniques 14 à 16", link:"1 Kings 15:9-24", summary:"Il entreprend une réforme religieuse significative, supprimant certains cultes idolâtres et allant jusqu'à destituer sa propre grand-mère de son statut de reine mère pour avoir favorisé une idole. Il remporte une victoire militaire importante contre une invasion éthiopienne, attribuée à la confiance placée en Dieu. Vers la fin de son règne cependant, face à une menace du royaume du Nord, il choisit de payer un roi syrien pour obtenir son soutien plutôt que de s'en remettre à Dieu, ce qui lui vaut une réprimande prophétique."},
      {name:"Josaphat", dates:"v. 870 - 848", avatar:"🏛️", tag:"bon", ref:"1 Rois 22:41-50 ; 2 Chroniques 17 à 20", link:"1 Kings 22:41-50", summary:"Il poursuit largement les réformes religieuses de son père Asa et renforce l'administration de la justice dans le royaume en nommant des juges dans les villes. Il s'allie cependant à plusieurs reprises avec les rois du royaume du Nord, notamment par un mariage entre son fils et une fille d'Achab, une alliance qui aura des conséquences négatives pour ses successeurs. Son règne est aussi marqué par une victoire militaire remportée sans combat, après un temps de prière et de louange face à une coalition ennemie."},
      {name:"Joram", dates:"v. 848 - 841", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 8:16-24 ; 2 Chroniques 21", link:"2 Kings 8:16-24", summary:"À son accession au trône, il fait exécuter tous ses frères pour asseoir son pouvoir. Sous l'influence de son épouse, fille d'Achab, il introduit des pratiques religieuses idolâtres inspirées du royaume du Nord. Son règne est marqué par la perte de contrôle sur Édom et par une lettre de reproche qui lui est adressée, selon le texte, de la part du prophète Élie. Il meurt d'une maladie intestinale douloureuse et prolongée, sans être regretté par le peuple."},
      {name:"Achazia", dates:"v. 841", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 8:25-29 ; 9:27-29 ; 2 Chroniques 22", link:"2 Kings 8:25-29", summary:"Fils de Joram et petit-fils d'Achab par sa mère, il suit les conseils de la maison d'Achab. Alors qu'il rend visite au roi d'Israël, il se trouve pris dans le coup d'État mené par Jéhu et est tué en tentant de fuir."},
      {name:"Athalie", dates:"v. 841 - 835", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 11:1-20 ; 2 Chroniques 22:10 à 23:21", link:"2 Kings 11", summary:"Fille d'Achab et de Jézabel, elle profite de la mort de son fils Achazia pour s'emparer du pouvoir et fait exterminer tous les autres descendants royaux afin d'éliminer toute concurrence, sauf un nourrisson, Joas, caché par sa tante dans le Temple. Elle favorise le culte de Baal durant son règne. Après six ans, le prêtre Yehoyada organise un coup d'État en présentant Joas comme roi légitime ; elle est exécutée et le culte de Baal est démantelé."},
      {name:"Joas", dates:"v. 835 - 796", avatar:"🏛️", tag:"mitige", ref:"2 Rois 11:21 à 12:21 ; 2 Chroniques 24", link:"2 Kings 12", summary:"Sauvé enfant du massacre organisé par Athalie, il est proclamé roi à sept ans sous la tutelle du prêtre Yehoyada, qui l'oriente vers une politique de fidélité religieuse et organise la restauration du Temple grâce à une collecte spéciale. Après la mort de Yehoyada cependant, il se laisse influencer par d'autres conseillers, tolère un retour de pratiques idolâtres, et fait même mettre à mort le fils de son ancien tuteur pour l'avoir critiqué. Son règne se termine par une invasion syrienne et il est assassiné par ses propres officiers."},
      {name:"Amatsia", dates:"v. 796 - 767", avatar:"🏛️", tag:"mitige", ref:"2 Rois 14:1-20 ; 2 Chroniques 25", link:"2 Kings 14:1-20", summary:"Il fait exécuter les meurtriers de son père mais épargne leurs enfants, en accord avec un principe de responsabilité individuelle. Il remporte une victoire militaire contre Édom, mais ramène de cette campagne des idoles qu'il se met à adorer, ce qui lui vaut une réprimande prophétique. Il provoque ensuite imprudemment un conflit avec le royaume du Nord, qui se solde par une lourde défaite et le pillage de Jérusalem. Il est assassiné à la suite d'une conspiration."},
      {name:"Ozias (Azaria)", dates:"v. 767 - 740", avatar:"🏛️", tag:"bon", ref:"2 Rois 15:1-7 ; 2 Chroniques 26", link:"2 Kings 15:1-7", summary:"Son long règne est marqué par une importante prospérité militaire et économique, incluant la reconstruction de villes et le développement de l'agriculture. Vers la fin de sa vie cependant, fort de ses succès, il s'introduit dans le Temple pour y offrir lui-même de l'encens, une fonction réservée aux prêtres ; il est aussitôt frappé de lèpre et doit vivre isolé jusqu'à sa mort, laissant son fils Yotam assurer la régence."},
      {name:"Yotam", dates:"v. 740 - 732", avatar:"🏛️", tag:"bon", ref:"2 Rois 15:32-38 ; 2 Chroniques 27", link:"2 Kings 15:32-38", summary:"Il poursuit une politique globalement fidèle et renforce les fortifications et l'administration du royaume, mais le texte biblique note qu'il ne fait rien pour supprimer les hauts lieux où le peuple continue des pratiques religieuses non conformes."},
      {name:"Achaz", dates:"v. 732 - 716", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 16:1-20 ; 2 Chroniques 28", link:"2 Kings 16", summary:"Face à une coalition formée par la Syrie et le royaume du Nord contre Juda, il choisit de faire appel à l'Assyrie plutôt que de faire confiance à Dieu, malgré l'avertissement du prophète Ésaïe. Cette alliance le place sous tutelle assyrienne et il introduit dans le Temple un autel copié sur un modèle assyrien. Son règne est marqué par une idolâtrie particulièrement intense, incluant des sacrifices d'enfants."},
      {name:"Ézéchias", dates:"v. 716 - 687", avatar:"🏛️", tag:"bon", ref:"2 Rois 18:1 à 20:21 ; 2 Chroniques 29 à 32 ; Ésaïe 36 à 39", link:"2 Kings 18-20", summary:"Il entreprend dès le début de son règne une réforme religieuse profonde, rouvrant et purifiant le Temple, supprimant les hauts lieux, et détruisant même un objet ancien devenu support d'un culte idolâtre. Il se rebelle contre la tutelle assyrienne, ce qui provoque une invasion du roi assyrien Sennachérib et un siège de Jérusalem ; sur les conseils du prophète Ésaïe, il s'en remet à la prière plutôt qu'à la capitulation, et le récit rapporte la destruction soudaine de l'armée assyrienne. Gravement malade par ailleurs, il obtient une prolongation de vie après une prière. Il commet cependant une imprudence en montrant tous ses trésors à des émissaires babyloniens, ce qui vaut à Juda une annonce prophétique d'exil futur."},
      {name:"Manassé", dates:"v. 687 - 642", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 21:1-18 ; 2 Chroniques 33:1-20", link:"2 Kings 21:1-18", summary:"Fils d'Ézéchias, il inverse radicalement la politique religieuse de son père en réintroduisant les hauts lieux, en dressant des autels à des divinités étrangères jusque dans le Temple, et en pratiquant des sacrifices d'enfants et la divination. Son règne, le plus long de l'histoire de Juda, est jugé comme le plus idolâtre de tous, et le texte attribue en partie à ses fautes l'exil futur du royaume. Selon les Chroniques, il est capturé et déporté par les Assyriens, se repent en captivité, et entreprend à son retour quelques réformes partielles, sans toutefois éliminer tous les cultes qu'il avait introduits."},
      {name:"Amon", dates:"v. 642 - 640", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 21:19-26 ; 2 Chroniques 33:21-25", link:"2 Kings 21:19-26", summary:"Fils de Manassé, il poursuit les pratiques idolâtres de son père sans manifester le repentir tardif de celui-ci, et il est assassiné par ses propres serviteurs après seulement deux ans de règne ; le peuple met ensuite à mort les conspirateurs et place son jeune fils Josias sur le trône."},
      {name:"Josias", dates:"v. 640 - 609", avatar:"🏛️", tag:"bon", ref:"2 Rois 22:1 à 23:30 ; 2 Chroniques 34 à 35", link:"2 Kings 22-23", summary:"Monté sur le trône enfant, il entreprend dès l'adolescence une réforme religieuse et, en faisant restaurer le Temple, ses ouvriers y redécouvrent un exemplaire du livre de la Loi resté longtemps oublié. Sa lecture le pousse à intensifier considérablement sa réforme : destruction des hauts lieux et des objets de culte idolâtre dans tout le royaume, y compris dans l'ancien royaume du Nord, et célébration d'une Pâque exceptionnelle. Son règne est présenté comme un modèle de fidélité, comparable à celui de David. Il meurt cependant au combat contre le pharaon Néco, qui traversait son territoire, mettant fin prématurément à son règne."},
      {name:"Joachaz", dates:"v. 609", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 23:31-33 ; 2 Chroniques 36:1-4", link:"2 Kings 23:31-33", summary:"Fils de Josias, choisi par le peuple pour succéder à son père, il ne règne que trois mois avant d'être déposé par le pharaon égyptien Néco, qui l'emmène captif en Égypte et impose un tribut à Juda."},
      {name:"Yehoyaqim", dates:"v. 609 - 598", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 23:34 à 24:7 ; 2 Chroniques 36:5-8", link:"2 Kings 23:34-24:7", summary:"Placé sur le trône par le pharaon égyptien à la place de son frère, il devient ensuite vassal de Babylone après la victoire de Nabuchodonosor sur l'Égypte. Il ignore et fait même détruire un rouleau contenant les avertissements du prophète Jérémie. Il finit par se rebeller contre Babylone, ce qui provoque une intervention militaire de Nabuchodonosor."},
      {name:"Yehoyakîn", dates:"v. 598 - 597", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 24:8-17 ; 2 Chroniques 36:9-10", link:"2 Kings 24:8-17", summary:"Fils de Yehoyaqim, il monte sur le trône dans un contexte de siège babylonien et se rend rapidement à Nabuchodonosor après seulement trois mois de règne. Il est déporté à Babylone avec une partie de l'élite du royaume, dont le prophète Ézéchiel, lors de ce que l'on appelle le premier exil."},
      {name:"Sédécias", dates:"v. 597 - 586", avatar:"🏛️", tag:"mauvais", ref:"2 Rois 24:18 à 25:21 ; 2 Chroniques 36:11-21", link:"2 Kings 24:18-25:21", summary:"Placé sur le trône par Nabuchodonosor à la place de son neveu Yehoyakîn, il finit par se rebeller contre Babylone malgré les avertissements répétés du prophète Jérémie de s'y soumettre. Cette rébellion provoque un siège prolongé de Jérusalem qui se termine par la prise de la ville, la destruction du Temple et du palais royal en 586 av. J.-C., l'exécution de ses fils sous ses yeux avant qu'il ne soit lui-même rendu aveugle et emmené captif à Babylone. Cet événement marque le début de l'exil babylonien et la fin du royaume de Juda en tant qu'État indépendant."}
    ]
  },
  {
    id:"grands-prophetes",
    title:"Les grands prophètes",
    desc:"Des figures majeures dont les livres ou les récits occupent une place centrale, d'Élie à Daniel.",
    entries:[
      {name:"Élie", dates:"royaume du Nord, sous Achab", tag:null, avatar:"🔥", ref:"1 Rois 17 à 19 ; 21 ; 2 Rois 1 à 2", link:"1 Kings 17-19", summary:"Prophète surgissant sans généalogie précisée dans le récit, il intervient sous le règne d'Achab pour annoncer une sécheresse en punition du culte de Baal. Nourri miraculeusement dans le désert puis chez une veuve étrangère dont il ressuscite le fils, il organise ensuite un défi spectaculaire au mont Carmel face à des centaines de prophètes de Baal, où le feu tombé du ciel sur son sacrifice démontre la souveraineté de Dieu. Poursuivi par la reine Jézabel après ce défi, il fuit dans le désert où, épuisé et découragé, il rencontre Dieu non dans le vent, le tremblement de terre ou le feu, mais dans un souffle doux et léger. Il oint ensuite Élisée comme successeur et intervient encore, notamment pour condamner Achab après l'affaire de la vigne de Naboth. Le récit rapporte qu'il ne meurt pas mais est enlevé au ciel dans un tourbillon, accompagné d'un char et de chevaux de feu."},
      {name:"Élisée", dates:"successeur d'Élie", tag:null, avatar:"🧴", ref:"1 Rois 19:19-21 ; 2 Rois 2 à 13", link:"2 Kings 2-13", summary:"Simple agriculteur, il est appelé par Élie qui jette son manteau sur lui, un geste symbolique d'investiture. Après le départ d'Élie, il reçoit une double portion de son esprit et accomplit un nombre de miracles supérieur à celui de son prédécesseur : purification d'une source empoisonnée, multiplication d'huile pour sauver une veuve endettée, résurrection du fils d'une femme de Shunem, guérison de la lèpre du général syrien Naaman après qu'il se soit baigné sept fois dans le Jourdain, ou encore l'épisode où une hache flotte à la surface de l'eau. Son ministère s'étend sur le règne de plusieurs rois d'Israël et il continue d'intervenir dans les affaires politiques du royaume jusqu'à sa mort ; un dernier miracle est même rapporté après son décès, lorsqu'un cadavre déposé en hâte dans sa tombe reprend vie à son contact."},
      {name:"Ésaïe (Isaïe)", dates:"royaume de Juda, sous Ozias à Ézéchias", tag:null, avatar:"📜", ref:"Livre d'Ésaïe, 66 chapitres ; récits en 2 Rois 19 à 20 et Ésaïe 36 à 39", link:"Isaiah 1", summary:"Actif à Jérusalem sous plusieurs rois, d'Ozias à Ézéchias, il reçoit sa vocation lors d'une vision où il voit Dieu dans le Temple entouré de créatures célestes. Son livre alterne des oracles de jugement contre l'infidélité de Juda et des nations voisines, et des promesses de restauration et de consolation futures. Il intervient personnellement auprès du roi Achaz pour l'inciter à faire confiance à Dieu plutôt qu'à des alliances politiques, puis auprès d'Ézéchias lors du siège assyrien de Jérusalem, annonçant la délivrance de la ville. Son livre contient également des textes particulièrement développés sur une figure de serviteur souffrant et sur un règne futur de paix, relus dans la tradition chrétienne comme annonçant le Messie."},
      {name:"Jérémie", dates:"fin du royaume de Juda", tag:null, avatar:"😢", ref:"Livre de Jérémie, 52 chapitres ; Lamentations", link:"Jeremiah 1", summary:"Appelé à la prophétie dès sa jeunesse, il exerce son ministère dans les dernières décennies du royaume de Juda, jusqu'à la chute de Jérusalem et au-delà. Il annonce à plusieurs reprises et de façon insistante la destruction imminente de la ville si le peuple ne se détourne pas de ses fautes, ce qui lui vaut d'être rejeté, emprisonné et menacé de mort par ses contemporains, y compris par certains rois. Il accomplit aussi plusieurs gestes symboliques pour illustrer ses messages, comme porter un joug de bois ou acheter un champ alors que la ville est assiégée, en signe d'espérance future. Après la chute de Jérusalem, il reste dans le pays avec le petit reste de la population avant d'être emmené de force en Égypte. Le livre des Lamentations, une série de poèmes funèbres sur la destruction de Jérusalem, lui est traditionnellement attribué."},
      {name:"Ézéchiel", dates:"en exil à Babylone", tag:null, avatar:"🦴", ref:"Livre d'Ézéchiel, 48 chapitres, dont la vision des ossements en Ézéchiel 37", link:"Ezekiel 1", summary:"Prêtre déporté à Babylone lors du premier exil, il reçoit sa vocation prophétique par une vision complexe impliquant des créatures célestes et un char divin. Son ministère se déroule entièrement en exil et combine des avertissements sur la chute imminente de Jérusalem, qu'il annonce alors que la ville tient encore, et des paroles de consolation pour la suite. Il accomplit de nombreux gestes symboliques, parfois déroutants, pour illustrer ses messages, comme rester silencieux ou mimer un siège avec une brique. Sa vision la plus connue est celle d'une vallée d'ossements desséchés qui reprennent chair et vie, image d'une restauration future du peuple. Il décrit aussi le départ progressif de la gloire de Dieu hors du Temple avant sa destruction, puis, dans une vision finale, son retour dans un temple futur idéalisé."},
      {name:"Daniel", dates:"exilé à Babylone dès sa jeunesse", tag:null, avatar:"🦁", ref:"Livre de Daniel, 12 chapitres, dont la fosse aux lions en Daniel 6", link:"Daniel 1", summary:"Déporté à Babylone encore jeune avec d'autres nobles de Juda, il est formé à la cour babylonienne tout en refusant de se souiller par la nourriture royale. Il se distingue par sa capacité à interpréter les rêves du roi Nabuchodonosor, dont un songe annonçant une succession de royaumes représentés par une statue aux matériaux divers. Trois de ses compagnons sont jetés dans une fournaise ardente pour avoir refusé d'adorer une statue et en ressortent indemnes. Sous un roi ultérieur, une inscription mystérieuse apparaît lors d'un banquet, que Daniel seul parvient à déchiffrer, annonçant la chute imminente du royaume babylonien. Sous l'empire perse, la jalousie de rivaux le conduit à être jeté dans une fosse aux lions pour avoir continué à prier malgré une interdiction royale, mais il en ressort indemne. La seconde partie de son livre rapporte des visions complexes annonçant une succession d'empires futurs."}
    ]
  },
  {
    id:"petits-prophetes",
    title:"Les douze petits prophètes",
    desc:"Nommés ainsi pour la longueur de leurs livres, non pour leur importance, ils couvrent plusieurs siècles d'histoire.",
    entries:[
      {name:"Osée", dates:"royaume du Nord, avant sa chute", avatar:"📯", tag:null, ref:"Livre d'Osée, 14 chapitres", link:"Hosea 1", summary:"Actif dans le royaume du Nord dans les décennies précédant sa chute, il reçoit l'ordre inhabituel d'épouser une femme infidèle, dont la relation brisée puis restaurée sert de parabole vivante à l'infidélité d'Israël envers Dieu et à la fidélité malgré tout de ce dernier. Ses enfants reçoivent des noms symboliques annonçant le jugement à venir. Son livre dénonce l'idolâtrie et les alliances politiques instables du royaume, tout en promettant une restauration future."},
      {name:"Joël", dates:"date incertaine", tag:null, avatar:"🦗", ref:"Livre de Joël, 3 à 4 chapitres selon les versions", link:"Joel 1", summary:"Son livre, de datation incertaine, s'ouvre sur la description d'une invasion de sauterelles dévastatrice interprétée comme un signe avant-coureur d'un jugement plus grand, le jour du Seigneur. Il appelle le peuple à un jeûne collectif de repentance, et annonce en retour une restauration agricole ainsi qu'une effusion future de l'Esprit sur toutes les catégories de la population, un texte repris plus tard dans le Nouveau Testament."},
      {name:"Amos", dates:"royaume du Nord, sous Jéroboam II", tag:null, avatar:"🐑", ref:"Livre d'Amos, 9 chapitres", link:"Amos 1", summary:"Berger et cultivateur dans le royaume de Juda, il est envoyé prophétiser dans le royaume du Nord sous le règne prospère de Jéroboam II. Il dénonce avec une vigueur particulière l'écart entre les rituels religieux et l'injustice sociale généralisée, notamment l'exploitation des pauvres par les riches marchands et propriétaires. Il annonce un jugement imminent malgré la prospérité apparente du royaume, tout en concluant sur une promesse de restauration future de la dynastie davidique."},
      {name:"Abdias", dates:"date incertaine", tag:null, avatar:"📜", ref:"Livre d'Abdias, 1 chapitre", link:"Obadiah 1", summary:"Le plus court livre de l'Ancien Testament, il consiste en un unique oracle de jugement contre le peuple d'Édom, descendant d'Ésaü, accusé d'avoir profité du malheur de Juda lors d'une invasion pour piller et livrer des fugitifs plutôt que de venir en aide à un peuple apparenté."},
      {name:"Jonas", dates:"royaume du Nord, sous Jéroboam II", tag:null, avatar:"🐋", ref:"Livre de Jonas, 4 chapitres", link:"Jonah 1", summary:"Envoyé pour annoncer un jugement à Ninive, capitale de l'empire assyrien ennemi, il tente de fuir sa mission par bateau en direction opposée. Une tempête menace le navire, et les marins, après avoir tiré au sort, le jettent par-dessus bord à sa demande, ce qui calme la mer. Il est alors avalé par un grand poisson dans lequel il passe trois jours avant d'être rejeté sur le rivage. Il se rend finalement à Ninive, dont les habitants, contre toute attente, se repentent en masse à l'annonce de son message, ce qui provoque chez lui une colère et une déception face à la miséricorde accordée à ses ennemis."},
      {name:"Michée", dates:"royaume de Juda, contemporain d'Ésaïe", tag:null, avatar:"⚖️", ref:"Livre de Michée, 7 chapitres, dont l'annonce de Bethléem en Michée 5:1", link:"Micah 1", summary:"Contemporain d'Ésaïe dans le royaume de Juda, il dénonce l'injustice des dirigeants et des riches propriétaires qui exploitent les paysans, ainsi que la corruption de certains prêtres et prophètes. Il annonce la destruction de Samarie puis de Jérusalem en punition de ces fautes, mais aussi une restauration future centrée sur un souverain issu de Bethléem, un texte relu comme une annonce messianique. Son livre contient également une définition célèbre de ce que Dieu attend du peuple : la justice, la bonté et l'humilité."},
      {name:"Nahum", dates:"avant la chute de Ninive", tag:null, avatar:"🏛️", ref:"Livre de Nahum, 3 chapitres", link:"Nahum 1", summary:"Son livre annonce en termes poétiques puissants la destruction prochaine de Ninive, capitale de l'empire assyrien qui avait autrefois détruit le royaume du Nord, présentée comme un juste retour après des décennies de cruauté impériale."},
      {name:"Habaquq", dates:"fin du royaume de Juda", tag:null, avatar:"💬", ref:"Livre d'Habaquq, 3 chapitres", link:"Habakkuk 1", summary:"Plutôt qu'un oracle adressé au peuple, son livre prend la forme d'un dialogue entre le prophète et Dieu, où il s'interroge sur la présence de l'injustice à Juda puis, de façon plus troublante encore, sur le fait que Dieu semble vouloir utiliser un peuple encore plus violent, les Babyloniens, comme instrument de jugement. Le livre se conclut par une déclaration de confiance malgré l'absence de réponse complète, et par un psaume de louange."},
      {name:"Sophonie", dates:"royaume de Juda, sous Josias", tag:null, avatar:"📯", ref:"Livre de Sophonie, 3 chapitres", link:"Zephaniah 1", summary:"Actif sous le règne de Josias, il annonce un jugement universel touchant Juda et les nations environnantes lors d'un jour du Seigneur décrit en termes redoutables, en lien probable avec les réformes religieuses en cours à cette époque. Il conclut néanmoins sur une promesse de restauration et de joie pour un reste fidèle épargné."},
      {name:"Aggée", dates:"après le retour d'exil", tag:null, avatar:"🏗️", ref:"Livre d'Aggée, 2 chapitres", link:"Haggai 1", summary:"Actif peu après le retour d'exil, alors que la reconstruction du Temple, commencée puis interrompue depuis plusieurs années, stagne pendant que le peuple s'occupe de ses propres maisons, il interpelle directement les dirigeants et le peuple pour reprendre les travaux, en leur promettant une bénédiction renouvelée en réponse à leur obéissance."},
      {name:"Zacharie", dates:"après le retour d'exil, contemporain d'Aggée", avatar:"📯", tag:null, ref:"Livre de Zacharie, 14 chapitres", link:"Zechariah 1", summary:"Contemporain d'Aggée, il encourage lui aussi la reconstruction du Temple à travers une série de visions nocturnes riches en symboles, portant sur la purification du grand prêtre, la restauration de Jérusalem et l'avenir du peuple. La seconde partie de son livre contient des oracles plus énigmatiques sur un roi futur humble venant sur un âne, ainsi que sur des événements de crise et de restauration finale."},
      {name:"Malachie", dates:"après le retour d'exil, dernier livre prophétique", tag:null, avatar:"📯", ref:"Livre de Malachie, 3 à 4 chapitres selon les versions", link:"Malachi 1", summary:"Dernier livre prophétique de l'Ancien Testament selon l'ordre traditionnel, il s'adresse à une communauté revenue d'exil mais devenue religieusement relâchée, dénonçant des sacrifices de mauvaise qualité offerts par les prêtres et l'infidélité conjugale répandue dans le peuple. Il annonce la venue d'un messager qui précédera un jour du Seigneur redoutable, un texte reliant, dans la tradition chrétienne, ce messager à une figure prophétique à venir. Son livre clôt une longue période sans parole prophétique reconnue dans le récit biblique."}
    ]
  },
  {
    id:"douze-apotres",
    title:"Les douze apôtres",
    desc:"Qui ils étaient, et ce que la tradition rapporte sur la fin de leur vie — au-delà du texte biblique lui-même pour plusieurs d'entre eux.",
    entries:[
      {name:"Simon-Pierre", dates:"", tag:null, avatar:"🔑", ref:"Marc 1:16-18 ; Matthieu 16:13-19", link:"Matthew 16:13-19", summary:"Ancien pêcheur de Galilée, il reçoit de Jésus une place de premier plan parmi les Douze et le surnom de Pierre, la pierre sur laquelle l'Église sera bâtie selon Matthieu. Il renie pourtant Jésus trois fois la nuit de son arrestation, avant d'être restauré après la résurrection. La tradition rapporte qu'il devient le premier évêque de Rome et y meurt martyr sous Néron, crucifié la tête en bas par humilité de ne pas mourir comme son maître."},
      {name:"André", dates:"", tag:null, avatar:"✖️", ref:"Jean 1:35-42", link:"John 1:35-42", summary:"Frère de Simon-Pierre, disciple de Jean-Baptiste avant de suivre Jésus, il est présenté par l'évangile de Jean comme le premier appelé. La tradition situe sa prédication en Grèce et en Asie Mineure, et rapporte qu'il est martyrisé à Patras, attaché à une croix en forme de X, aujourd'hui appelée croix de saint André."},
      {name:"Jacques, fils de Zébédée (le Majeur)", dates:"", tag:null, avatar:"⚔️", ref:"Actes 12:1-2", link:"Acts 12:1-2", summary:"Frère de Jean, l'un des trois disciples les plus proches de Jésus, présent à la Transfiguration et à Gethsémani. Il devient le premier apôtre dont le martyre est rapporté directement dans le texte biblique, décapité sur ordre du roi Hérode Agrippa Ier. Une tradition espagnole tardive associe son tombeau au sanctuaire de Saint-Jacques-de-Compostelle."},
      {name:"Jean", dates:"", tag:null, avatar:"🦅", ref:"Jean 21:20-24 ; Apocalypse 1:9", link:"Revelation 1", summary:"Frère de Jacques, souvent identifié à la tradition du disciple que Jésus aimait, il est traditionnellement associé à l'évangile qui porte son nom et à l'Apocalypse, reçue selon le texte alors qu'il est exilé sur l'île de Patmos. Il serait le seul apôtre à ne pas être mort martyr, s'éteignant de vieillesse à Éphèse."},
      {name:"Philippe", dates:"", tag:null, avatar:"🐟", ref:"Jean 1:43-46", link:"John 1:43-46", summary:"Originaire de Bethsaïda, il amène Nathanaël à Jésus peu après son propre appel. La tradition situe son ministère en Asie Mineure, dans la région de Hiérapolis, où il aurait été martyrisé, crucifié ou lapidé selon les versions du récit traditionnel."},
      {name:"Barthélemy", dates:"", tag:null, avatar:"🗡️", ref:"Souvent identifié à Nathanaël (Jean 1:45-51)", link:"John 1:45-51", summary:"Probablement identifiable au Nathanaël de l'évangile de Jean, présenté par Jésus comme un homme sans détour. La tradition situe sa prédication en Arménie ou en Inde, et rapporte un martyre particulièrement violent, écorché vif puis décapité, ce qui explique qu'il soit souvent représenté dans l'art tenant sa propre peau."},
      {name:"Thomas", dates:"", tag:null, avatar:"👉", ref:"Jean 20:24-29", link:"John 20:24-29", summary:"Connu pour avoir douté du témoignage des autres disciples sur la résurrection, refusant de croire avant d'avoir lui-même touché les plaies de Jésus, ce qu'il finit par faire. La tradition rapporte une évangélisation jusqu'en Inde, où une communauté chrétienne ancienne revendique aujourd'hui encore cette origine ; il y aurait été martyrisé, transpercé d'une lance."},
      {name:"Matthieu", dates:"", tag:null, avatar:"💰", ref:"Matthieu 9:9-13", link:"Matthew 9:9-13", summary:"Collecteur d'impôts au service de l'occupant romain, une profession méprisée, il est appelé par Jésus alors qu'il est assis à son poste de péage. Traditionnellement identifié comme l'auteur de l'évangile qui porte son nom, la tradition situe son martyre en Éthiopie ou en Perse selon les sources."},
      {name:"Jacques, fils d'Alphée (le Mineur)", dates:"", tag:null, avatar:"📜", ref:"Marc 3:18", link:"Mark 3:16-19", summary:"L'un des apôtres les moins documentés dans le texte biblique, parfois rapproché de la figure de Jacques le Juste, responsable de la première communauté de Jérusalem. La tradition rapporte un martyre à Jérusalem, précipité du haut du Temple avant d'être lapidé."},
      {name:"Thaddée (Jude)", dates:"", tag:null, avatar:"💌", ref:"Souvent associé à l'épître de Jude", link:"Jude 1", summary:"Parfois appelé Jude fils de Jacques, il pose dans l'évangile de Jean une question à Jésus sur la manière dont celui-ci se manifestera aux disciples sans se manifester au monde. La tradition l'associe à une évangélisation de la Perse aux côtés de Simon le Zélote, où les deux auraient été martyrisés ensemble."},
      {name:"Simon le Zélote", dates:"", tag:null, avatar:"🔥", ref:"Luc 6:15", link:"Luke 6:12-16", summary:"Son surnom laisse penser qu'il aurait été proche, avant sa vocation, d'un mouvement nationaliste juif opposé à l'occupation romaine. Le texte biblique ne rapporte rien de plus précis sur lui ; la tradition l'associe à Thaddée pour une mission et un martyre communs en Perse."},
      {name:"Judas Iscariot", dates:"", tag:null, avatar:"🪙", ref:"Matthieu 26:14-16 ; 27:3-5", link:"Matthew 27:3-5", summary:"Trésorier du groupe des disciples selon l'évangile de Jean, il livre Jésus aux autorités religieuses pour trente pièces d'argent. Rongé par le remords après la condamnation de Jésus, il se pend selon le récit de Matthieu, un dénouement rapporté avec des détails légèrement différents dans les Actes des Apôtres."},
      {name:"Matthias", dates:"", tag:null, avatar:"🎲", ref:"Actes 1:15-26", link:"Acts 1:15-26", summary:"Choisi par tirage au sort parmi les disciples pour remplacer Judas et compléter le nombre des Douze après l'Ascension. Le texte biblique ne rapporte plus rien de lui ensuite ; des traditions tardives et peu fiables situent sa mission en Cappadoce ou en Éthiopie."}
    ]
  },
  {
    id:"grands-portraits",
    title:"Portraits des grandes figures",
    desc:"Abraham, Joseph, Moïse, Josué : les mêmes grands récits, racontés comme une histoire qu'on conte plutôt qu'en simple résumé.",
    entries:[
      {name:"Abraham", dates:"", tag:null, avatar:"⭐", ref:"Genèse 12 à 25", link:"Genesis 12-25", summary:"Il s'appelle encore Abram quand Dieu lui demande de tout quitter : son pays, sa famille, la maison de son père, pour partir vers une terre qu'il ne connaît pas encore. Il obéit, avec Sara son épouse et son neveu Lot, sans savoir où le chemin le mène. En route, il traverse la peur (il fait passer Sara pour sa sœur en Égypte par crainte pour sa vie), la générosité (il laisse à Lot le choix des meilleures terres), et le doute (il tente de hâter la promesse d'un fils en ayant Ismaël avec la servante Agar). Mais l'histoire retient surtout une nuit où Dieu lui montre les étoiles et lui promet une descendance aussi nombreuse qu'elles, et un jour terrible où, sur ordre reçu, il monte une montagne avec son fils Isaac pour un sacrifice interrompu au tout dernier moment. Il meurt vieux et comblé, ayant vu naître la promesse sans en voir l'accomplissement complet."},
      {name:"Joseph", dates:"", tag:null, avatar:"🌾", ref:"Genèse 37 ; 39 à 50", link:"Genesis 37", summary:"Onzième fils de Jacob, préféré de son père au point de recevoir une tunique remarquable, il fait à ses frères le récit maladroit de rêves où ils s'inclinent devant lui. Jaloux, ils le vendent comme esclave à une caravane en partance pour l'Égypte et font croire à leur père qu'une bête l'a dévoré. En Égypte, Joseph gravit malgré tout les échelons chez son maître, avant d'être jeté en prison sur une fausse accusation. C'est là, en interprétant les rêves d'un panetier et d'un échanson, qu'il attire l'attention de Pharaon, dont il interprète ensuite les propres rêves annonçant sept années d'abondance suivies de sept années de famine. Nommé second du royaume, il organise les réserves qui sauveront l'Égypte, puis, quand ses frères viennent y acheter du grain sans le reconnaître, il choisit après les avoir éprouvés de leur pardonner entièrement et de faire venir toute la famille en Égypte."},
      {name:"Moïse", dates:"", tag:null, avatar:"🪔", ref:"Exode 2 à 40 ; Deutéronome 34", link:"Exodus 2", summary:"Né alors que Pharaon a ordonné la mort de tous les nouveau-nés hébreux, il est déposé par sa mère dans un panier sur le Nil et recueilli par la propre fille de Pharaon, qui l'élève à la cour égyptienne. Adulte, après avoir tué un contremaître égyptien qui frappait un esclave hébreu, il fuit au désert de Madian, où il devient berger et fonde une famille. C'est là, devant un buisson qui brûle sans se consumer, qu'il reçoit la mission de retourner en Égypte réclamer la libération de son peuple. Après une confrontation marquée par dix plaies successives, Pharaon laisse enfin partir les Hébreux, avant de les poursuivre jusqu'à la mer, que le récit décrit s'ouvrant pour laisser passer le peuple et se refermant sur l'armée égyptienne. Au mont Sinaï, Moïse reçoit les Tables de la Loi ; son visage en redescend si lumineux qu'il doit porter un voile. Il conduit le peuple quarante ans à travers le désert, marqués par des murmures répétés et des infidélités, avant de mourir sur le mont Nebo, ayant seulement pu apercevoir de loin la terre promise sans jamais y entrer."},

      {name:"Memorare", dates:"", tag:null, ref:"Attribué à la tradition de saint Bernard de Clairvaux", avatar:"🕊️", summary:"Souvenez-vous, ô très miséricordieuse Vierge Marie, qu'on n'a jamais entendu dire qu'aucun de ceux qui ont eu recours à votre protection, imploré votre assistance et réclamé votre secours, ait été abandonné. Animé d'une pareille confiance, ô Vierge des vierges, ô ma Mère, je viens à vous, et gémissant sous le poids de mes péchés, je me prosterne à vos pieds. Ne dédaignez pas mes paroles, ô Mère du Verbe, mais écoutez-les favorablement et daignez les exaucer. Amen."},
      {name:"Prière à saint Michel Archange", dates:"", tag:null, ref:"Composée par le pape Léon XIII (fin du XIXe siècle)", avatar:"⚔️", summary:"Saint Michel archange, défendez-nous dans le combat ; soyez notre protection contre la malice et les embûches du démon. Que Dieu lui commande, nous le prions humblement, et vous, prince de la milice céleste, repoussez en enfer, par la puissance divine, Satan et les autres esprits mauvais qui rôdent dans le monde pour la perte des âmes. Amen."},
      {name:"Le chapelet (structure)", dates:"", tag:null, ref:"Pratique mariale développée au Moyen Âge", avatar:"📿", externalUrl:"#", linkLabel:"Prier le chapelet dans l'appli →", summary:"Pas une prière unique mais une méditation structurée en dizaines, alternant Notre Père, dix Je vous salue Marie et Gloire au Père, organisée autour de quatre séries de mystères (joyeux, douloureux, glorieux, lumineux) retraçant la vie du Christ et de Marie. Retrouvez la version guidée dans Prier › Chapelet."},
      {name:"Regina Coeli", dates:"", tag:null, ref:"Remplace l'Angélus durant le temps pascal", avatar:"🌸", summary:"Reine du ciel, réjouissez-vous, alléluia. Car celui que vous avez mérité de porter, alléluia. Est ressuscité comme il l'a dit, alléluia. Priez Dieu pour nous, alléluia. Réjouissez-vous et soyez dans la joie, Vierge Marie, alléluia. Car le Seigneur est vraiment ressuscité, alléluia."},
      {name:"Sub tuum praesidium", dates:"", tag:null, ref:"L'une des plus anciennes prières mariales connues", avatar:"🛡️", summary:"Nous avons recours à votre protection, sainte Mère de Dieu. Ne rejetez pas les prières que nous vous adressons dans nos besoins, mais délivrez-nous toujours de tous les dangers, ô Vierge glorieuse et bénie."},
      {name:"Litanies de Lorette (extrait)", dates:"", tag:null, ref:"Titres mariaux traditionnels — réponse : priez pour nous", avatar:"📋", summary:"Seigneur, ayez pitié de nous. Sainte Marie, priez pour nous. Sainte Mère de Dieu, Sainte Vierge des vierges, Mère du Christ, Mère de l'Église, Mère très pure, Mère très chaste, Vierge très prudente, Vierge très fidèle, Miroir de justice, Reine des anges, Reine des patriarches, Reine des prophètes, Reine des apôtres, Reine des martyrs, Reine de tous les saints, Reine conçue sans le péché originel, Reine de la paix, priez pour nous."},
      {name:"Prière de saint François (Seigneur, fais de moi un instrument de ta paix)", dates:"", tag:null, ref:"Attribuée à saint François d'Assise", avatar:"🕊️", summary:"Seigneur, fais de moi un instrument de ta paix. Là où il y a de la haine, que je mette l'amour. Là où il y a l'offense, que je mette le pardon. Là où il y a la discorde, que je mette l'union. Là où il y a l'erreur, que je mette la vérité. Là où il y a le doute, que je mette la foi. Là où il y a le désespoir, que je mette l'espérance. Là où il y a les ténèbres, que je mette la lumière. Là où il y a la tristesse, que je mette la joie. Ô Maître, que je ne cherche pas tant à être consolé qu'à consoler, à être compris qu'à comprendre, à être aimé qu'à aimer. Car c'est en donnant qu'on reçoit, c'est en s'oubliant qu'on trouve, c'est en pardonnant qu'on est pardonné, c'est en mourant qu'on ressuscite à l'éternelle vie. Amen."},
      {name:"Le Bénédicité", dates:"", tag:null, ref:"Prière avant le repas", avatar:"🍞", summary:"Bénissez-nous, Seigneur, ainsi que ce repas qui vient de votre bonté, par le Christ notre Seigneur. Amen."},
      {name:"Prière pour les défunts (Éternel repos)", dates:"", tag:null, ref:"Prière de suffrage pour les morts", avatar:"🕯️", summary:"Donnez-leur, Seigneur, le repos éternel, et que la lumière sans déclin luise pour eux. Qu'ils reposent en paix. Amen."},
      {name:"Actes de foi, d'espérance et de charité", dates:"", tag:null, ref:"Trois courtes prières classiques", avatar:"❤️", summary:"Acte de foi : Mon Dieu, je crois fermement toutes les vérités que vous avez révélées et que l'Église nous propose à croire, parce que vous ne pouvez ni vous tromper ni nous tromper. Acte d'espérance : Mon Dieu, j'espère avec une ferme confiance que vous me donnerez, par les mérites de Jésus-Christ, votre grâce en ce monde et la gloire éternelle en l'autre, parce que vous l'avez promis et que vous êtes fidèle à vos promesses. Acte de charité : Mon Dieu, je vous aime de tout mon cœur et par-dessus toute chose, parce que vous êtes infiniment bon et digne d'être aimé, et j'aime mon prochain comme moi-même pour l'amour de vous."}
    ]
  },
  {
    id:"neuvaines",
    title:"Neuvaines connues",
    desc:"Des prières réparties sur neuf jours consécutifs, une pratique inspirée des neuf jours d'attente des apôtres entre l'Ascension et la Pentecôte. Voici la prière centrale de chacune, à répéter chaque jour de la neuvaine.",
    entries:[
      {name:"Neuvaine à l'Esprit Saint", dates:"", tag:null, ref:"Entre l'Ascension et la Pentecôte", avatar:"🕊️", summary:"Viens, Esprit Saint, remplis le cœur de tes fidèles et allume en eux le feu de ton amour. Envoie ton Esprit et tout sera créé, et tu renouvelleras la face de la terre. Ô Dieu, qui as instruit les cœurs de tes fidèles par la lumière de l'Esprit Saint, donne-nous, par ce même Esprit, de goûter ce qui est droit et de jouir toujours de ses consolations. Amen."},
      {name:"Neuvaine à la Divine Miséricorde", dates:"", tag:null, ref:"Du Vendredi saint au dimanche de la Miséricorde", avatar:"❤️", summary:"Éternel Père, je vous offre le Corps et le Sang, l'Âme et la Divinité de votre Fils bien-aimé, Notre-Seigneur Jésus-Christ, en propitiation pour nos péchés et pour ceux du monde entier. Pour sa douloureuse Passion, ayez pitié de nous et du monde entier. Ô Sang et Eau, qui avez jailli du Cœur de Jésus comme une source de miséricorde pour nous, j'ai confiance en vous."},
      {name:"Neuvaine à sainte Rita de Cascia", dates:"", tag:null, ref:"Neuvaine votive, souvent avant sa fête du 22 mai", avatar:"🌹", summary:"Ô sainte Rita, toi qui as toujours mis ta confiance en Dieu et qui as su aimer et pardonner au nom du Christ en te laissant guider par la lumière de l'Esprit Saint, tourne vers moi ton regard si tendre. Toi qu'on invoque comme l'avocate des causes désespérées, présente au Seigneur l'intention que je te confie aujourd'hui. Obtiens-moi la grâce de ne jamais désespérer et de mettre toute ma confiance en Dieu, quoi qu'il arrive. Amen."},
      {name:"Neuvaine à sainte Thérèse de l'Enfant-Jésus", dates:"", tag:null, ref:"Souvent avant sa fête du 1er octobre", avatar:"🌸", summary:"Sainte Thérèse de l'Enfant-Jésus, qui avez dit vouloir passer votre ciel à faire du bien sur la terre et laisser tomber une pluie de roses, faites-nous connaître, une fois de plus, votre puissance auprès du Cœur de Dieu, en nous accordant la grâce que nous sollicitons par votre intercession. Amen."},
      {name:"Neuvaine à saint Joseph", dates:"", tag:null, ref:"Souvent avant sa fête du 19 mars", avatar:"🔨", summary:"Saint Joseph, modèle des travailleurs et gardien des familles, veillez sur nous. Obtenez-nous l'esprit de foi et de simplicité dans nos tâches quotidiennes, la paix dans nos foyers, et accordez-nous, par votre intercession auprès de Jésus et de Marie, la grâce que nous vous demandons aujourd'hui. Amen."},
      {name:"Neuvaine à Notre-Dame du Perpétuel Secours", dates:"", tag:null, ref:"Traditionnellement priée le mercredi", avatar:"🖼️", summary:"Ô Mère du Perpétuel Secours, vous êtes le secours perpétuel des chrétiens : secourez-moi partout et toujours, dans mes tentations, dans mes besoins, dans mes peines, surtout dans mes combats, à l'heure de ma mort. Obtenez-moi, Vierge de miséricorde, la grâce que je sollicite en cette neuvaine. Amen."},
      {name:"Neuvaine de l'Avent (neuvaine de Noël)", dates:"", tag:null, ref:"Traditionnellement récitée 15 fois par jour du 30 novembre au 24 décembre", avatar:"⭐", summary:"Salut et bénie soit l'heure où le Fils de Dieu est né de la très pure Vierge Marie, à minuit, dans le froid intense, à Bethléem. En cette heure, je vous en supplie, ô mon Dieu, d'exaucer ma prière et de m'accorder la grâce que je demande, par les mérites de notre Sauveur Jésus-Christ et de sa Bienheureuse Mère. Amen."},
      {name:"Neuvaine des 54 jours (rosaire)", dates:"", tag:null, ref:"27 jours de demande puis 27 jours d'action de grâce", avatar:"📿", externalUrl:"#", linkLabel:"Prier le chapelet dans l'appli →", summary:"Cette neuvaine n'a pas de texte propre : elle consiste à prier un chapelet complet chaque jour pendant 54 jours consécutifs — vingt-sept jours en esprit de demande, puis vingt-sept jours en esprit d'action de grâce, que la grâce demandée ait été obtenue ou non."},
      {name:"Neuvaine à saint Antoine de Padoue", dates:"", tag:null, ref:"D'après le répons \u00abSi quaeris miracula\u00bb", avatar:"🐟", summary:"Si tu cherches les miracles, la mort, l'erreur, tous les fléaux, le démon fuit, les lépreux sont guéris. Devant saint Antoine, que l'on invoque, la mer s'apaise, les prisonniers retrouvent la liberté, les membres perdus ou malades sont réparés. Saint Antoine, obtiens-moi de retrouver ce qui compte vraiment dans ma vie, et intercède pour l'intention que je te confie aujourd'hui. Amen."},
      {name:"Neuvaine à saint Jude Thaddée", dates:"", tag:null, ref:"Patron des causes désespérées", avatar:"🔥", summary:"Ô glorieux apôtre saint Jude, fidèle serviteur et ami de Jésus, l'Église vous honore et vous invoque universellement comme le patron des causes désespérées. Priez pour moi qui suis si malheureux, et obtenez-moi, je vous en supplie, le secours du ciel dans l'épreuve qui m'accable en ce moment. Je promets de faire connaître la grâce reçue et de vous honorer toujours comme mon puissant intercesseur. Amen."},
      {name:"Neuvaine à saint Christophe", dates:"", tag:null, ref:"Patron des voyageurs", avatar:"🚗", summary:"Saint Christophe, toi qui as porté le Christ sur tes épaules pour lui faire traverser le fleuve, protège-nous sur nos routes et nos chemins. Garde-nous des accidents et des dangers du voyage, et fais que nous arrivions toujours à bon port. Amen."},
      {name:"Neuvaine à saint Expédit", dates:"", tag:null, ref:"Prié pour les causes urgentes", avatar:"⏳", summary:"Ô grand saint Expédit, vous qui obtenez des grâces promptes dans les situations les plus pressantes, hâtez-vous de m'assister dans la circonstance présente. En retour, je m'engage à faire connaître la faveur obtenue. Saint Expédit, patron des causes urgentes, priez pour nous. Amen."},
      {name:"Neuvaine à saint Benoît", dates:"", tag:null, ref:"D'après la formule de la médaille de saint Benoît", avatar:"✝️", summary:"Que la sainte Croix soit ma lumière, que le mal ne soit jamais mon guide. Recule, ce qui s'oppose à Dieu : c'est un mal que tu proposes, garde pour toi ton poison. Saint Benoît, obtiens-nous protection et paix intérieure face à ce qui nous éprouve. Priez pour nous. Amen."},
      {name:"Neuvaine à sainte Bernadette Soubirous", dates:"", tag:null, ref:"En lien avec les apparitions de Lourdes", avatar:"💧", summary:"Sainte Bernadette, toi à qui la Vierge Marie s'est montrée dans la simplicité et la pauvreté, apprends-nous à croire sans avoir besoin de tout comprendre, et à garder un cœur d'enfant devant Dieu. Intercède pour l'intention que je te confie en cette neuvaine. Amen."},
      {name:"Neuvaine à saint Pio de Pietrelcina (Padre Pio)", dates:"", tag:null, ref:"Neuvaine au Sacré-Cœur souvent attribuée à Padre Pio", avatar:"🙌", summary:"Ô mon Jésus, vous avez dit : demandez et vous recevrez, cherchez et vous trouverez, frappez et l'on vous ouvrira. Par l'intercession de Padre Pio, j'ose vous demander la grâce de... (formuler sa demande). Ô Cœur sacré de Jésus, je vous confie cette intention par les mains de Marie, votre Mère sainte et la mienne. Amen."},
      {name:"Neuvaine au Sacré-Cœur de Jésus", dates:"", tag:null, ref:"Souvent avant la fête du Sacré-Cœur", avatar:"❤️‍🔥", summary:"Cœur sacré de Jésus, j'ai confiance en vous. Cœur sacré de Jésus, source de miséricorde infinie, je viens déposer devant vous l'intention que je porte en ce moment, certain(e) que rien de ce qui vous est confié avec confiance ne reste sans réponse. Amen."},
      {name:"Neuvaine à l'Immaculée Conception", dates:"", tag:null, ref:"Prière de la médaille miraculeuse, du 30 novembre au 8 décembre", avatar:"💙", summary:"Ô Marie, conçue sans péché, priez pour nous qui avons recours à vous."},
      {name:"Neuvaine à saint Charbel", dates:"", tag:null, ref:"Moine libanais, prié pour la guérison", avatar:"🌿", summary:"Saint Charbel, moine humble et silencieux, toi dont le corps est resté incorrompu comme signe de la puissance de Dieu, obtiens-nous la grâce de la guérison et de la paix intérieure. Prie pour nous et pour l'intention que nous te confions. Amen."},
      {name:"Neuvaine à Notre-Dame de Fatima", dates:"", tag:null, ref:"D'après la prière enseignée à Fatima", avatar:"☀️", summary:"Ô mon Jésus, pardonnez-nous nos péchés, préservez-nous du feu de l'enfer, conduisez au ciel toutes les âmes, surtout celles qui ont le plus besoin de votre miséricorde. Notre-Dame de Fatima, obtenez la conversion des cœurs et la paix dans le monde. Amen."},
      {name:"Neuvaine à saint Michel Archange", dates:"", tag:null, ref:"Voir la prière complète dans « Prières fondamentales »", avatar:"⚔️", summary:"Saint Michel archange, défendez-nous dans le combat ; soyez notre protection contre la malice et les embûches du démon. Que Dieu lui commande, nous le prions humblement, et vous, prince de la milice céleste, repoussez en enfer, par la puissance divine, Satan et les autres esprits mauvais qui rôdent dans le monde pour la perte des âmes. Amen."},
      {name:"Neuvaine de l'Assomption", dates:"", tag:null, ref:"Du 6 au 14 août", avatar:"🌤️", summary:"Vierge Marie, élevée corps et âme dans la gloire du ciel, tournez vers nous votre regard et obtenez-nous la grâce de garder confiance, même dans les jours difficiles : le ciel n'est pas un lointain rêve mais une promesse pour ceux qui restent fidèles. Amen."},
      {name:"Neuvaine à sainte Faustine (Divine Miséricorde)", dates:"", tag:null, ref:"Distincte de la neuvaine pascale de la Miséricorde", avatar:"📖", summary:"Sainte Faustine Kowalska, toi à qui Jésus a confié le message de sa Miséricorde infinie, aide-nous à faire confiance à cette Miséricorde même dans nos pires faiblesses, et à la répandre autour de nous par nos actes, nos paroles et notre prière. Amen."}
    ]
  },

/* ---------- psaumes au texte intégral (Louis Segond, 1910, domaine public) ----------
   Par honnêteté : seuls les psaumes ci-dessous, parmi les plus connus, sont reproduits
