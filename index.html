const PSAUMES_TEXTE_INTEGRAL = {
  1: "Heureux l'homme qui ne marche pas selon le conseil des méchants, qui ne s'arrête pas sur la voie des pécheurs, et qui ne s'assied pas en compagnie des moqueurs, mais qui trouve son plaisir dans la loi de l'Éternel, et qui la médite jour et nuit ! Il est comme un arbre planté près d'un courant d'eau, qui donne son fruit en sa saison, et dont le feuillage ne se flétrit point : tout ce qu'il fait lui réussit. Il n'en est pas ainsi des méchants : ils sont comme la paille que le vent dissipe. C'est pourquoi les méchants ne résistent pas au jour du jugement, ni les pécheurs dans l'assemblée des justes ; car l'Éternel connaît la voie des justes, et la voie des pécheurs mène à la ruine.",
  8: "Éternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre ! Ta majesté s'élève au-dessus des cieux. Quand je contemple les cieux, ouvrage de tes mains, la lune et les étoiles que tu as créées, je m'écrie : qu'est-ce que l'homme, pour que tu te souviennes de lui ? Et le fils de l'homme, pour que tu prennes garde à lui ? Tu l'as fait de peu inférieur à Dieu, et tu l'as couronné de gloire et de magnificence. Tu lui as donné la domination sur les œuvres de tes mains, tu as tout mis sous ses pieds. Éternel, notre Seigneur ! Que ton nom est magnifique sur toute la terre !",
  13: "Jusqu'à quand, Éternel ! m'oublieras-tu sans cesse ? Jusqu'à quand me cacheras-tu ta face ? Jusqu'à quand aurai-je des soucis dans mon âme, et chaque jour des chagrins dans mon cœur ? Jusqu'à quand mon ennemi s'élèvera-t-il contre moi ? Regarde, réponds-moi, Éternel, mon Dieu ! Donne à mes yeux la clarté, afin que je ne m'endorme pas du sommeil de la mort. Pour moi, j'ai confiance en ta bonté, j'aurai le cœur joyeux, à cause de ton salut ; je chanterai à l'Éternel, car il m'a fait du bien.",
  23: "L'Éternel est mon berger : je ne manquerai de rien. Il me fait reposer dans de verts pâturages, il me dirige près des eaux paisibles. Il restaure mon âme, il me conduit dans les sentiers de la justice, à cause de son nom. Quand je marche dans la vallée de l'ombre de la mort, je ne crains aucun mal, car tu es avec moi : ta houlette et ton bâton me rassurent. Tu dresses devant moi une table, en face de mes adversaires ; tu oins d'huile ma tête, et ma coupe déborde. Oui, le bonheur et la grâce m'accompagneront tous les jours de ma vie, et j'habiterai dans la maison de l'Éternel jusqu'à la fin de mes jours.",
  27: "L'Éternel est ma lumière et mon salut : de qui aurais-je crainte ? L'Éternel est le soutien de ma vie : de qui aurais-je peur ? Quand des méchants s'avancent contre moi, pour dévorer ma chair, ce sont mes persécuteurs et mes ennemis qui chancellent et tombent. Si une armée se campait contre moi, mon cœur n'aurait aucune crainte ; si une guerre s'élevait contre moi, je serais malgré cela plein de confiance. Je demande à l'Éternel une chose, que je désire ardemment : je voudrais habiter toute ma vie dans la maison de l'Éternel, pour contempler la magnificence de l'Éternel et pour admirer son temple. Car il me protégera dans son tabernacle au jour du malheur, il me cachera sous l'abri de sa tente ; il m'élèvera sur un rocher. Éternel ! écoute ma voix, je t'invoque : aie pitié de moi et exauce-moi ! Mon cœur dit de ta part : cherchez ma face ! Je cherche ta face, ô Éternel ! Espère en l'Éternel ! Fortifie-toi et que ton cœur s'affermisse ! Espère en l'Éternel !",
  30: "Je t'exalte, ô Éternel, car tu m'as relevé, tu n'as pas voulu que mes ennemis se réjouissent à mon sujet. Éternel, mon Dieu ! J'ai crié à toi, et tu m'as guéri. Éternel ! Tu as fait remonter mon âme du séjour des morts, tu m'as fait revivre loin de ceux qui descendent dans la fosse. Chantez à l'Éternel, vous qui l'aimez, célébrez par vos louanges sa sainteté ! Car sa colère dure un instant, mais sa grâce toute la vie ; le soir arrivent les pleurs, et le matin l'allégresse. Tu as changé mon deuil en allégresse, tu as délié mon sac, et tu m'as ceint de joie, afin que mon cœur te chante et ne soit pas muet. Éternel, mon Dieu ! Je te louerai toujours.",
  32: "Heureux celui à qui la transgression est remise, à qui le péché est pardonné ! Heureux l'homme à qui l'Éternel n'impute pas d'iniquité, et dans l'esprit duquel il n'y a point de fraude ! Tant que je me suis tu, mes os se consumaient, je gémissais toute la journée. Aussi longtemps que je tairai mon péché, mon corps dépérira. Je t'ai fait connaître mon péché, je n'ai pas caché mon iniquité ; j'ai dit : j'avouerai mes transgressions à l'Éternel ! Et tu as effacé la peine de mon péché. Aussi tout homme pieux te prie au temps convenable. Tu es un asile pour moi, tu me garantis de la détresse, tu m'entoures de chants de délivrance.",
  34: "Je bénirai l'Éternel en tout temps ; sa louange sera toujours dans ma bouche. Que mon âme se glorifie en l'Éternel ! Que les malheureux écoutent et se réjouissent ! Exaltez avec moi l'Éternel ! Célébrons tous ensemble son nom ! J'ai cherché l'Éternel, et il m'a répondu ; il m'a délivré de toutes mes frayeurs. Quand on tourne vers lui les regards, on est rayonnant de joie, et le visage ne se couvre pas de honte. Quand un malheureux crie, l'Éternel entend, et il le sauve de toutes ses détresses. L'ange de l'Éternel campe autour de ceux qui le craignent, et il les arrache au danger. Sentez et voyez combien l'Éternel est bon ! Heureux l'homme qui cherche en lui son refuge ! Le Seigneur a les yeux sur les justes, et ses oreilles sont attentives à leurs cris. L'Éternel est près de ceux qui ont le cœur brisé, et il sauve ceux qui ont l'esprit dans l'abattement.",
  42: "Comme une biche soupire après des courants d'eau, ainsi mon âme soupire après toi, ô Dieu ! Mon âme a soif de Dieu, du Dieu vivant : quand irai-je et paraîtrai-je devant la face de Dieu ? Mes larmes sont ma nourriture jour et nuit, pendant qu'on me dit sans cesse : où est ton Dieu ? Pourquoi t'abats-tu, mon âme, et gémis-tu au-dedans de moi ? Espère en Dieu, car je le louerai encore ; il est mon salut et mon Dieu.",
  46: "Dieu est pour nous un refuge et un appui, un secours qui ne manque jamais dans la détresse. C'est pourquoi nous sommes sans crainte quand la terre est bouleversée, et que les montagnes chancellent au cœur des mers. Il y a un fleuve dont les courants réjouissent la cité de Dieu, le sanctuaire des demeures du Très-Haut. Dieu est au milieu d'elle : elle n'est point ébranlée ; Dieu la secourt dès l'aube du matin. Arrêtez, et sachez que je suis Dieu : je domine sur les nations, je domine sur la terre. L'Éternel des armées est avec nous, le Dieu de Jacob est pour nous une haute retraite.",
  51: "Ô Dieu ! Aie pitié de moi dans ta bonté ; selon ta grande miséricorde, efface mes transgressions. Lave-moi complètement de mon iniquité, et purifie-moi de mon péché. Car je reconnais mes transgressions, et mon péché est constamment devant moi. Ô Dieu ! Crée en moi un cœur pur, renouvelle en moi un esprit bien disposé. Ne me rejette pas loin de ta face, ne me retire pas ton esprit saint. Rends-moi la joie de ton salut, et qu'un esprit de bonne volonté me soutienne ! Seigneur, ouvre mes lèvres, et ma bouche publiera ta louange. Car tu ne désires pas de sacrifice, tu n'as point de plaisir aux holocaustes. Les sacrifices qui sont agréables à Dieu, c'est un esprit brisé : ô Dieu ! Tu ne dédaignes pas un cœur brisé et contrit.",
  90: "Seigneur ! Tu as été pour nous un refuge, de génération en génération. Avant que les montagnes fussent nées, et que tu eusses créé la terre et le monde, d'éternité en éternité tu es Dieu. Tu fais rentrer les hommes dans la poussière, et tu dis : fils de l'homme, retournez ! Car mille ans sont, à tes yeux, comme le jour d'hier, quand il n'est plus, et comme une veille de la nuit. Enseigne-nous à bien compter nos jours, afin que nous appliquions notre cœur à la sagesse. Rassasie-nous chaque matin de ta bonté, et nous serons toute notre vie dans la joie et l'allégresse.",
  91: "Celui qui demeure sous l'abri du Très-Haut repose à l'ombre du Tout-Puissant. Je dis à l'Éternel : mon refuge et ma forteresse, mon Dieu en qui je me confie ! Car c'est lui qui te délivre du filet de l'oiseleur, de la peste et de ses ravages. Il te couvrira de ses plumes, et tu trouveras un refuge sous ses ailes ; sa fidélité est un bouclier et une cuirasse. Tu ne craindras ni les terreurs de la nuit, ni la flèche qui vole de jour. Car il ordonnera à ses anges de te garder dans toutes tes voies ; ils te porteront sur les mains, de peur que ton pied ne heurte contre une pierre. Il m'invoque, et je lui répondrai ; je serai avec lui dans la détresse, je le délivrerai et je le glorifierai.",
  100: "Poussez vers l'Éternel des cris de joie, vous tous, habitants de la terre ! Servez l'Éternel, avec joie, venez avec allégresse en sa présence ! Sachez que l'Éternel est Dieu ! C'est lui qui nous a faits, et nous lui appartenons ; nous sommes son peuple, et le troupeau de son pâturage. Entrez dans ses portes avec des louanges, dans ses parvis avec des cantiques ! Célébrez-le, bénissez son nom ! Car l'Éternel est bon ; sa bonté dure toujours, et sa fidélité de génération en génération.",
  103: "Mon âme, bénis l'Éternel, et que tout ce qui est en moi bénisse son saint nom ! Mon âme, bénis l'Éternel, et n'oublie aucun de ses bienfaits ! C'est lui qui pardonne toutes tes iniquités, qui guérit toutes tes maladies ; c'est lui qui délivre ta vie de la fosse, qui te couronne de bonté et de miséricorde. L'Éternel est miséricordieux et compatissant, lent à la colère et riche en bonté. Autant l'orient est éloigné de l'occident, autant il éloigne de nous nos transgressions. Comme un père a compassion de ses enfants, l'Éternel a compassion de ceux qui le craignent.",
  118: "Louez l'Éternel, car il est bon, car sa miséricorde dure à toujours ! Je t'invoque du sein de la détresse : l'Éternel m'exauce, il me met au large. L'Éternel est pour moi, je ne crains rien : que peuvent me faire des hommes ? C'est ici la journée que l'Éternel a faite : qu'elle soit pour nous un sujet d'allégresse et de joie ! Ô Éternel, accorde le salut ! Ô Éternel, donne la prospérité ! La pierre qu'ont rejetée ceux qui bâtissaient est devenue la principale de l'angle.",
  121: "Je lève les yeux vers les montagnes... D'où me viendra le secours ? Le secours me vient de l'Éternel, qui a fait les cieux et la terre. Il ne permettra point que ton pied chancelle ; celui qui te garde ne sommeillera point. Voici, il ne sommeille ni ne dort, celui qui garde Israël. L'Éternel est celui qui te garde, l'Éternel est ton ombre à ta main droite. Pendant le jour le soleil ne te frappera point, ni la lune pendant la nuit. L'Éternel te gardera de tout mal, il gardera ton âme ; l'Éternel gardera ton départ et ton arrivée, dès maintenant et à jamais.",
  130: "Du fond de l'abîme je t'invoque, ô Éternel ! Seigneur, écoute ma voix ! Que tes oreilles soient attentives à la voix de mes supplications ! Si tu prenais garde aux iniquités, Éternel, Seigneur, qui pourrait subsister ? Mais le pardon se trouve auprès de toi, afin qu'on te craigne. Mon âme espère en l'Éternel, plus que les gardes n'espèrent le matin, que les gardes n'espèrent le matin. Israël, mets ton espoir en l'Éternel ! Car la miséricorde est auprès de l'Éternel, et la rédemption est auprès de lui en abondance.",
  67: "Que Dieu nous fasse grâce et nous bénisse, qu'il fasse briller sur nous sa face, afin que l'on connaisse sur la terre ta voie, et parmi toutes les nations ton salut ! Que les peuples te louent, ô Dieu ! Que tous les peuples te louent ! Que les nations se réjouissent et poussent des cris d'allégresse ! Car tu juges les peuples avec droiture, et tu conduis les nations sur la terre. Que les peuples te louent, ô Dieu ! Que tous les peuples te louent ! La terre donne ses produits ; Dieu, notre Dieu, nous bénit. Que Dieu nous bénisse, et que toutes les extrémités de la terre le craignent !",
  122: "Je suis dans la joie quand on me dit : Allons à la maison de l'Éternel ! Nos pieds s'arrêtent dans tes portes, Jérusalem ! Jérusalem, tu es bâtie comme une ville dont les parties sont liées ensemble. C'est là que montent les tribus, les tribus de l'Éternel, pour louer le nom de l'Éternel. Car là sont établis des sièges pour la justice, les sièges de la maison de David. Priez pour la paix de Jérusalem ! Que ceux qui t'aiment jouissent du repos ! Que la paix soit dans tes murs, et la tranquillité dans tes palais ! À cause de mes frères et de mes amis, je désire la paix dans ton sein.",
  128: "Heureux tout homme qui craint l'Éternel, qui marche dans ses voies ! Tu jouis alors du travail de tes mains, tu es heureux, tu prospères. Ta femme est comme une vigne féconde, dans l'intérieur de ta maison ; tes fils sont comme des plants d'olivier, autour de ta table. C'est ainsi qu'est béni l'homme qui craint l'Éternel. L'Éternel te bénira de Sion, et tu verras le bonheur de Jérusalem tous les jours de ta vie ; tu verras les fils de tes fils. Que la paix soit sur Israël !",
  131: "Éternel ! Je n'ai ni un cœur qui s'enfle, ni des regards hautains ; je ne m'occupe pas de choses trop grandes et trop relevées pour moi. Loin de là, j'ai l'âme calme et tranquille, comme un enfant sevré près de sa mère ; comme un enfant sevré, mon âme est en moi. Israël, mets ton espérance en l'Éternel, dès maintenant et à toujours !",
  150: "Louez l'Éternel ! Louez Dieu dans son sanctuaire ! Louez-le dans l'étendue, où éclate sa puissance ! Louez-le pour ses hauts faits ! Louez-le selon l'immensité de sa grandeur ! Louez-le au son de la trompette ! Louez-le avec le luth et la harpe ! Louez-le avec le tambourin et avec des danses ! Louez-le avec les instruments à cordes et le chalumeau ! Louez-le avec les cymbales sonores ! Louez-le avec les cymbales retentissantes ! Que tout ce qui respire loue l'Éternel ! Louez l'Éternel !"
};

    {name:"Le déluge et l'arche de Noé", dates:"", avatar:"🕊️", tag:"Texte intégral", ref:"Genèse 8, 6-12", summary:"« Au bout de quarante jours, Noé ouvrit la fenêtre qu'il avait faite à l'arche. Il lâcha le corbeau, qui sortit, allant et revenant, jusqu'à ce que les eaux eussent séché sur la terre. Il lâcha aussi la colombe, pour voir si les eaux avaient diminué à la surface de la terre. Mais la colombe ne trouva aucun lieu pour poser la plante de son pied, et elle revint à lui dans l'arche, car il y avait des eaux à la surface de toute la terre. Il avança la main, la prit, et la fit rentrer auprès de lui dans l'arche. Il attendit encore sept autres jours, et il lâcha de nouveau la colombe hors de l'arche. La colombe revint à lui sur le soir ; et voici, une feuille d'olivier arrachée était dans son bec. Noé connut ainsi que les eaux avaient diminué sur la terre. Il attendit encore sept autres jours ; et il lâcha la colombe. Et elle ne revint plus à lui. »"},
    {name:"La multiplication des pains", dates:"", avatar:"🍞", tag:"Texte intégral", ref:"Jean 6, 8-13", summary:"« Un de ses disciples, André, frère de Simon Pierre, lui dit : Il y a ici un jeune garçon qui a cinq pains d'orge et deux poissons ; mais qu'est-ce que cela pour tant de gens ? Jésus dit : Faites-les asseoir. Il y avait dans ce lieu beaucoup d'herbe. Ils s'assirent donc, au nombre d'environ cinq mille hommes. Jésus prit les pains, rendit grâces, et les distribua à ceux qui étaient assis ; il leur donna de même des poissons, autant qu'ils en voulurent. Lorsqu'ils furent rassasiés, il dit à ses disciples : Ramassez les morceaux qui restent, afin que rien ne se perde. Ils les ramassèrent donc, et ils remplirent douze paniers avec les morceaux qui restaient des cinq pains d'orge, après que tous eurent mangé. »"},

function todaysLiturgicalColor(){
  const banner = computeLiturgicalSeasonBanner();
  if(banner.includes("Avent") || banner.includes("Carême")) return 'violet';
  if(banner.includes("Noël") || banner.includes("pascal")) return 'blanc';
  if(banner.includes("Triduum")) return 'violet';
  return 'vert';
}

function checkBadges(){
  const unlocked = BADGES.filter(b => { try{ return b.test(); }catch(e){ return false; } }).map(b=>b.id);
  const newlyUnlocked = unlocked.filter(id => !NEW_BADGES_SEEN.includes(id));
  if(newlyUnlocked.length){
    const badge = BADGES.find(b=>b.id===newlyUnlocked[0]);
    NEW_BADGES_SEEN = [...NEW_BADGES_SEEN, ...newlyUnlocked];
    showToast('🏆 Nouveau succès : ' + badge.title);
  }
}

function computeLiturgicalSeasonBanner(){
  const today = new Date(); today.setHours(0,0,0,0);
  const years = [today.getFullYear()-1, today.getFullYear()];
  for(const y of years){
    const advent = adventStart(y);
    const xmasEve = new Date(y,11,24);
    const easterNext = getEasterDate(y+1);
    const christmasSeasonEnd = new Date(y+1,0,12);
    const ashWed = addDays(easterNext, -46);
    const holyThu = addDays(easterNext, -3);
    const easterSun = easterNext;
    const pentecost = addDays(easterNext, 49);
    const nextAdvent = adventStart(y+1);
    if(today >= advent && today < xmasEve) return "Nous sommes dans le Temps de l'Avent.";
    if(today >= xmasEve && today < christmasSeasonEnd) return "Nous sommes dans le Temps de Noël.";
    if(today >= christmasSeasonEnd && today < ashWed) return "Nous sommes dans le Temps ordinaire.";
    if(today >= ashWed && today < holyThu) return "Nous sommes en Carême.";
    if(today >= holyThu && today <= easterSun) return "Nous sommes dans le Triduum pascal.";
    if(today > easterSun && today <= pentecost) return "Nous sommes dans le Temps pascal.";
    if(today > pentecost && today < nextAdvent) return "Nous sommes dans le Temps ordinaire.";
  }
  return "";
}
const LITURGICAL_TIMELINE_SEASONS = [
  {key:'avent', label:'Avent', icon:'🕯️'},
  {key:'noel', label:'Noël', icon:'⭐'},
  {key:'ordinaire1', label:'Ordinaire', icon:'🟢'},
  {key:'careme', label:'Carême', icon:'✝️'},
  {key:'triduum', label:'Triduum', icon:'🩸'},
  {key:'pascal', label:'Pâques', icon:'🌅'},
  {key:'ordinaire2', label:'Ordinaire', icon:'🟢'}
];
function currentLiturgicalTimelineKey(){
  const banner = computeLiturgicalSeasonBanner();
  if(banner.includes('Avent')) return 'avent';
  if(banner.includes('Noël')) return 'noel';
  if(banner.includes('Carême')) return 'careme';
  if(banner.includes('Triduum')) return 'triduum';
  if(banner.includes('pascal')) return 'pascal';
  return 'ordinaire1';
}
function liturgicalTimelineHTML(){
  const currentKey = currentLiturgicalTimelineKey();
  let currentSeen = false;
  return `<div class="card liturgical-timeline">
    ${LITURGICAL_TIMELINE_SEASONS.map(s=>{
      const isCurrent = s.key===currentKey && !currentSeen;
      if(isCurrent) currentSeen = true;
      return `<div class="timeline-step ${isCurrent?'timeline-current':''}">
        <span class="timeline-icon">${s.icon}</span>
        <span class="timeline-label">${s.label}</span>
      </div>`;
    }).join('<div class="timeline-connector"></div>')}
  </div>`;
}

function todayKey(){
  const d = new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return mm+'-'+dd;
}
function dayOfYear(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  return Math.floor((d - start) / 86400000);
}
function getSaintOfDay(){
  const key = todayKey();
  const exact = SAINTS.find(s => s.d === key);
  if(exact) return {saint: exact, isFeast:true};
  const idx = dayOfYear() % SAINTS.length;
  return {saint: SAINTS[idx], isFeast:false};
}
function frenchDate(){
  const d = new Date();
  return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}

/* ---------- render ---------- */
function renderTabbar(){
  document.getElementById('tabbar').innerHTML = PRIMARY_TABS.map(t =>
    `<button class="tab-btn ${PRIMARY===t.key?'active':''}" data-tab="${t.key}">${ICONS[t.key]}<span>${t.label}</span></button>`
  ).join('');
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick = ()=>{
      PRIMARY = btn.dataset.tab;
      ENTRY_OPEN = null; OPEN_NOVENA = null;
      render();
    };
  });
}

function goTo(primary, sub){
  PRIMARY = primary;
  if(sub) SUBTAB[primary] = sub;
  ENTRY_OPEN = null; OPEN_NOVENA = null;
  render();
}

  const current = SUBTAB[PRIMARY] || subs[0].key;
  SUBTAB[PRIMARY] = current;
  return `<div class="subnav-row">${subs.map(s=>
    `<button class="subtab ${current===s.key?'active':''}" data-sub="${s.key}">${s.label}</button>`
  ).join('')}</div>`;
}
function wireSubnav(){
  document.querySelectorAll('.subtab').forEach(btn=>{
    btn.onclick = ()=>{ SUBTAB[PRIMARY] = btn.dataset.sub; ENTRY_OPEN=null; OPEN_NOVENA=null; render(); };
  });
}

function novenaProgressInfo(nov){
  const p = PROGRESS[nov.id] || {completed:[false,false,false,false,false,false,false,false,false]};
  const completedCount = p.completed.filter(Boolean).length;
  const currentDay = completedCount < 9 ? completedCount+1 : 9;
  return {completed: p.completed, completedCount, currentDay, done: completedCount===9};
}

let NOVENA_FULLTEXT = true;
function renderNovenaDetail(id){
  const n = NOVENAS.find(x=>x.id===id);
  const info = novenaProgressInfo(n);
  const dayIdx = info.done ? 9 : info.currentDay;
  const dayData = n.days[dayIdx-1];
  const alreadyDoneToday = info.completed[dayIdx-1];

  let dots = '';
  for(let i=1;i<=9;i++){
    let cls = 'day-dot';
    if(info.completed[i-1]) cls += ' done';
    else if(i===info.currentDay && !info.done) cls += ' current';
    dots += `<div class="${cls}">${info.completed[i-1] ? '✓' : i}</div>`;
  }

  let html = `<div class="detail-wrap">
    <button class="back-link" id="back-btn">← Toutes les neuvaines</button>
    <div class="eyebrow" style="color:${n.color}">${n.tag}</div>
    <h2 class="section-title" style="margin-top:2px;">${n.title}</h2>
    <p style="font-size:13.5px; color:var(--ink-soft); margin-top:-6px;">${n.sub}</p>
    <div style="text-align:right; margin:8px 0;">
      <button class="btn btn-ghost btn-sm" id="toggle-fulltext-btn">${NOVENA_FULLTEXT ? '🕯️ Revenir au parcours guidé' : '📖 Voir les 9 prières en entier'}</button>
    </div>
  `;

  if(NOVENA_FULLTEXT){
    html += `<p class="section-desc">Les neuf méditations et prières de cette neuvaine, à lire en entier ou à l'avance.</p>
      <div class="grid">${n.days.map((d,i)=>`
        <div class="card">
          <p class="eyebrow" style="color:${n.color};">Jour ${i+1}${info.completed[i]?' ✓':''}</p>
          <p class="day-title" style="font-size:15px;">${d.title}</p>
          <p class="day-medit">${d.medit}</p>
          <div class="day-prayer">${d.prayer}</div>
        </div>`).join('')}</div>`;
    html += `</div>`;
    document.getElementById('screen').innerHTML = html;
    document.getElementById('back-btn').onclick = ()=>{ OPEN_NOVENA=null; NOVENA_FULLTEXT=false; render(); };
    document.getElementById('toggle-fulltext-btn').onclick = ()=>{ NOVENA_FULLTEXT = false; render(); };
    return;
  }

  html += `<div class="day-dots">${dots}</div>`;

  if(info.done){
    html += `<div class="card" style="text-align:center;">
      <p class="day-title">Neuvaine achevée ✦</p>
      <p class="day-medit">Vous avez prié les neuf jours. Rien n'empêche de la recommencer, ou de porter une nouvelle intention.</p>
      <div class="candle-wrap" style="justify-content:center; margin-top:10px;">${candleHTML(true,'restart-candle')}</div>
      <button class="btn btn-ghost btn-sm" id="restart-btn" style="margin-top:14px;">Recommencer la neuvaine</button>
    </div>`;
  } else {
    html += `<div class="card">
      <p class="day-title">Jour ${dayIdx} — ${dayData.title}</p>
      <p class="day-medit">${dayData.medit}</p>
      <div class="day-prayer">${dayData.prayer}</div>
      <div class="candle-wrap">
        ${candleHTML(alreadyDoneToday, 'day-candle')}
        <button class="btn ${alreadyDoneToday? 'btn-ghost':'btn-primary'} btn-sm" id="pray-day-btn" ${alreadyDoneToday? 'disabled':''}>
          ${alreadyDoneToday? "Prié aujourd'hui ✓" : "J'ai prié ce jour"}
        </button>
      </div>
      <div class="companions-row">
        <span class="companions-count" id="companions-count">🤝 ${NOVENA_COMPANIONS[n.id]||0} personne(s) prient cette neuvaine avec vous</span>
      </div>
      <div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;">
        <button class="btn btn-gold btn-sm" id="join-companions-btn">🤝 Je m'engage aussi</button>
        <button class="btn btn-ghost btn-sm" id="invite-companion-btn">📤 Inviter quelqu'un</button>
      </div>
    </div>`;
  }
  html += `</div>`;

  document.getElementById('screen').innerHTML = html;
  document.getElementById('back-btn').onclick = ()=>{ OPEN_NOVENA=null; NOVENA_FULLTEXT=false; render(); };
  document.getElementById('toggle-fulltext-btn').onclick = ()=>{ NOVENA_FULLTEXT = true; render(); };

  const joinBtn = document.getElementById('join-companions-btn');
  if(joinBtn){
    joinBtn.onclick = async ()=>{
      await incrementNovenaCompanions(n.id);
      document.getElementById('companions-count').textContent = `🤝 ${NOVENA_COMPANIONS[n.id]||0} personne(s) prient cette neuvaine avec vous`;
      showToast('Merci de vous joindre à cette neuvaine 🤝');
    };
  }
  const inviteBtn = document.getElementById('invite-companion-btn');
  if(inviteBtn){
    inviteBtn.onclick = ()=> shareText('Prions ensemble', `Je prie la ${n.title} en ce moment (${n.sub}). Rejoins-moi si tu veux prier avec moi, jour après jour.`);
  }

  const prayBtn = document.getElementById('pray-day-btn');
  if(prayBtn){
    prayBtn.onclick = async ()=>{
      const candle = document.getElementById('day-candle');
      candle.classList.add('lit','burst');
      if(!PROGRESS[n.id]) PROGRESS[n.id] = {completed:[false,false,false,false,false,false,false,false,false]};
      PROGRESS[n.id].completed[dayIdx-1] = true;
      await saveProgress(PROGRESS);
      setTimeout(()=> render(), 550);
    };
  }
  const restartBtn = document.getElementById('restart-btn');
  if(restartBtn){
    restartBtn.onclick = async ()=>{
      PROGRESS[n.id] = {completed:[false,false,false,false,false,false,false,false,false]};
      await saveProgress(PROGRESS);
      render();
    };
  }
}

}

function intentionCardHTML(it){
  return `<div class="card intention-card ${it.answered?'intention-answered':''}" data-id="${it.id}">
    ${it.answered ? `<p class="intention-answered-badge">✨ Prière exaucée</p>` : ''}

function findIntention(id){
  return INTENTIONS.find(x=>x.id===id) || PRIVATE_INTENTIONS.find(x=>x.id===id);
}

function wireIntentionButtons(){
  document.querySelectorAll('.pray-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const it = findIntention(id);
      if(!it) return;
      it.prayers += 1;
      const candle = document.getElementById('candle-'+id);
      if(candle){ candle.classList.add('lit','burst'); }
      const countEl = btn.closest('.intention-card, .card').querySelector('.prayer-count');
      if(countEl) countEl.textContent = it.prayers + ' personnes ont prié';
      if(it.private) await savePrivateIntentions(PRIVATE_INTENTIONS);
      else await saveIntentions(INTENTIONS);
    };
  });
  document.querySelectorAll('.answered-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const it = findIntention(id);
      if(!it) return;
      it.answered = !it.answered;
      if(it.answered) showToast('✨ Merci Seigneur !');
      if(it.private) await savePrivateIntentions(PRIVATE_INTENTIONS);
      else await saveIntentions(INTENTIONS);
      renderIntentions();
    };
  });
}

let CAL_VIEW = 'saints';
let CAL_YEAR = new Date().getFullYear();
let CAL_MONTH = new Date().getMonth();
let CAL_SELECTED = null;

const MONTH_NAMES_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const WEEKDAY_LETTERS = ["L","M","M","J","V","S","D"];

function findSaintsByMMDD(mm, dd){
  const key = mm + "-" + dd;
  return SAINTS.filter(s => s.d === key);
}

function buildMonthCells(year, month){
  const first = new Date(year, month, 1);
  let startOffset = first.getDay() - 1; // 0=Monday
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++){
    const d = daysInPrevMonth - startOffset + i + 1;
    cells.push({day:d, inMonth:false, month: month===0?11:month-1, year: month===0?year-1:year});
  }
  for(let d=1; d<=daysInMonth; d++){ cells.push({day:d, inMonth:true, month, year}); }
  while(cells.length % 7 !== 0 || cells.length < 42){
    const idx = cells.length - (startOffset + daysInMonth);
    cells.push({day: idx+1, inMonth:false, month: month===11?0:month+1, year: month===11?year+1:year});
    if(cells.length >= 42) break;
  }
  return cells;
}

function renderSaintsCalendar(){
  const today = new Date();
  const cells = buildMonthCells(CAL_YEAR, CAL_MONTH);
  let html = `<div class="cal-nav">
    <button class="cal-nav-btn" id="cal-prev">←</button>
    <span class="cal-month-label">${MONTH_NAMES_FR[CAL_MONTH]} ${CAL_YEAR}</span>
    <button class="cal-nav-btn" id="cal-next">→</button>
  </div>
  <div class="cal-weekdays">${WEEKDAY_LETTERS.map(l=>`<span>${l}</span>`).join('')}</div>
  <div class="cal-grid">`;
  cells.forEach(c=>{
    const mm = String(c.month+1).padStart(2,'0');
    const dd = String(c.day).padStart(2,'0');
    const matches = c.inMonth ? findSaintsByMMDD(mm,dd) : [];
    const isToday = c.inMonth && c.year===today.getFullYear() && c.month===today.getMonth() && c.day===today.getDate();
    const isSelected = CAL_SELECTED && CAL_SELECTED.year===c.year && CAL_SELECTED.month===c.month && CAL_SELECTED.day===c.day;
    let cls = 'cal-cell';
    if(!c.inMonth) cls += ' out-month';
    if(matches.length) cls += ' has-saint';
    if(isToday) cls += ' today';
    if(isSelected) cls += ' selected';
    html += `<div class="${cls}" data-y="${c.year}" data-m="${c.month}" data-d="${c.day}">
      <span class="cal-daynum">${c.day}</span>${matches.length?'<span class="cal-dot"></span>':''}
    </div>`;
  });
  html += `</div>`;

  if(CAL_SELECTED){
    const mm = String(CAL_SELECTED.month+1).padStart(2,'0');
    const dd = String(CAL_SELECTED.day).padStart(2,'0');
    const matches = findSaintsByMMDD(mm,dd);
    if(matches.length){
      html += matches.map(s => `<div class="card saint-card">
        <div class="halo-wrap" style="width:52px;height:52px;"><div class="halo-ring"></div><div class="halo-avatar" style="inset:5px;font-size:20px;">${s.name.trim()[0]}</div></div>
        <div>
          <p class="saint-name">${s.name}</p>
          <p class="saint-bio">${s.bio}</p>
          <p class="saint-prayer">${s.prayer}</p>
        </div>
      </div>`).join('');
    } else {
      html += `<div class="card empty-state">Pas de saint particulier associé à cette date dans notre calendrier — chaque jour reste bon pour se tourner vers Dieu.</div>`;
    }
  } else {
    html += `<p class="section-desc" style="text-align:center;">Touchez un jour marqué d'un point pour découvrir le saint associé.</p>`;
  }

  document.getElementById('screen').innerHTML = `<h2 class="section-title">✦ Calendrier des saints</h2>${renderCalToggleHTML()}` + html;
  wireCalToggle();
  document.getElementById('cal-prev').onclick = ()=>{ CAL_MONTH--; if(CAL_MONTH<0){CAL_MONTH=11; CAL_YEAR--;} render(); };
  document.getElementById('cal-next').onclick = ()=>{ CAL_MONTH++; if(CAL_MONTH>11){CAL_MONTH=0; CAL_YEAR++;} render(); };
  document.querySelectorAll('.cal-cell.has-saint').forEach(c=>{
    c.onclick = ()=>{ CAL_SELECTED = {year:parseInt(c.dataset.y), month:parseInt(c.dataset.m), day:parseInt(c.dataset.d)}; render(); };
  });
}

    <button data-view="temps" class="${CAL_VIEW==='temps'?'active':''}">📅 Temps &amp; fêtes</button>

function compressImageFile(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e)=>{
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = Math.round(h * maxSize/w); w = maxSize; }
        else if(h > maxSize){ w = Math.round(w * maxSize/h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= studio (ambient loops, mon espace) ================= */
let AUDIO_CTX = null;
let MASTER_GAIN = null;
let AUDIO_READY = false;
let LOOP_TIMER = null;
let CURRENT_LOOP = null;

function ensureAudio(){
  try{
    if(!AUDIO_CTX){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC){ showToast("Ce navigateur ne supporte pas l'audio Web Audio API"); return null; }
      AUDIO_CTX = new AC();
      MASTER_GAIN = AUDIO_CTX.createGain();
      MASTER_GAIN.gain.value = 0.9;
      MASTER_GAIN.connect(AUDIO_CTX.destination);
    }
    if(AUDIO_CTX.state === 'suspended'){
      AUDIO_CTX.resume().then(()=>{ AUDIO_READY = true; }).catch(()=>{
        showToast("Impossible d'activer le son — touchez à nouveau l'écran");
      });
    } else {
      AUDIO_READY = true;
    }
    return AUDIO_CTX;
  }catch(e){
    console.error('ensureAudio error', e);
    showToast("Erreur audio : " + (e.message||e));
    return null;
  }
}
function testSound(){
  const ctx = ensureAudio();
  if(!ctx) return;
  tone(ctx, 523.25, ctx.currentTime, 0.35, 'sine', 0.25);
  tone(ctx, 659.25, ctx.currentTime+0.12, 0.35, 'sine', 0.25);
  showToast('🔊 Si vous entendez deux notes, le son fonctionne !');
}
function tone(ctx, freq, t, dur, type, gain){
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain||0.15, t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(MASTER_GAIN || ctx.destination);
  o.start(t); o.stop(t+dur+0.05);
}
function noiseHit(ctx, t, dur, gain, lp){
  const bufSize = Math.max(1, Math.floor(ctx.sampleRate*dur));
  const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufSize);
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const g = ctx.createGain(); g.gain.setValueAtTime(gain||0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  if(lp){ const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = lp; src.connect(f); f.connect(g); }
  else src.connect(g);
  g.connect(MASTER_GAIN || ctx.destination);
  src.start(t);
}
const LOOP_DEFS = {
  piano: {bar:2.0, fn:(ctx,t0)=>{ [261.6,329.6,392.0,523.3].forEach((f,i)=> tone(ctx,f,t0+i*0.5,0.9,'sine',0.12)); }},
  lofi: {bar:2.4, fn:(ctx,t0)=>{ [220,261.6,329.6].forEach((f,i)=> tone(ctx,f,t0+i*0.7,1.3,'triangle',0.08)); noiseHit(ctx,t0,2.2,0.02,4000); }},
  ambient: {bar:4.0, fn:(ctx,t0)=>{ tone(ctx,196,t0,3.8,'sine',0.09); tone(ctx,199,t0,3.8,'sine',0.07); tone(ctx,294,t0+0.4,3.2,'sine',0.06); }},
  basse: {bar:1.2, fn:(ctx,t0)=>{ tone(ctx,98,t0,0.5,'sine',0.18); tone(ctx,98,t0+0.6,0.4,'sine',0.14); }},
  tamtam: {bar:0.6, fn:(ctx,t0)=>{ noiseHit(ctx,t0,0.18,0.22,900); }},
  chorale: {bar:3.0, fn:(ctx,t0)=>{ [220,277.2,329.6].forEach(f=> tone(ctx,f,t0,2.8,'sine',0.07)); }},
  acapella: {bar:2.5, fn:(ctx,t0)=>{ tone(ctx,261.6,t0,2.3,'sine',0.13); }},
  rap: {bar:1.33, fn:(ctx,t0)=>{ noiseHit(ctx,t0,0.15,0.22,150); noiseHit(ctx,t0+0.66,0.06,0.1,6000); noiseHit(ctx,t0+1.0,0.06,0.1,6000); }},
  drill: {bar:0.857, fn:(ctx,t0)=>{ noiseHit(ctx,t0,0.12,0.2,150); noiseHit(ctx,t0+0.21,0.04,0.08,7000); noiseHit(ctx,t0+0.43,0.12,0.16,150); noiseHit(ctx,t0+0.64,0.04,0.08,7000); }},
  sabar: {bar:0.5, fn:(ctx,t0)=>{ noiseHit(ctx,t0,0.08,0.2,1200); noiseHit(ctx,t0+0.25,0.06,0.14,1600); }}
};
function stopLoop(){
  if(LOOP_TIMER){ clearInterval(LOOP_TIMER); LOOP_TIMER = null; }
  CURRENT_LOOP = null;
}
function startLoop(key){
  stopLoop();
  const ctx = ensureAudio();
  if(!ctx) return;
  const def = LOOP_DEFS[key];
  if(!def) return;
  CURRENT_LOOP = key;
  const playBar = ()=> def.fn(ctx, ctx.currentTime + 0.05);
  playBar();
  LOOP_TIMER = setInterval(playBar, def.bar*1000);
}
let LOUANGE_FILTER = 'Toutes';

/* ================================================================
   BEATMAKING STUDIO — batterie, clavier, enregistreur vocal
   ================================================================ */

/* ---- synthèse des percussions ---- */
function playKick(ctx, t){
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(40, t+0.15);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.28);
  o.connect(g); g.connect(MASTER_GAIN || ctx.destination);
  o.start(t); o.stop(t+0.3);
}
function playSnare(ctx, t){
  noiseHit(ctx, t, 0.16, 0.5, 2500);
  tone(ctx, 190, t, 0.1, 'triangle', 0.15);
}
function playHihat(ctx, t, open){
  const dur = open ? 0.32 : 0.06;
  const bufSize = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufSize;i++) data[i] = (Math.random()*2-1)*(1-i/bufSize);
  const src = ctx.createBufferSource(); src.buffer = buffer;
  const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 7000;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(hp); hp.connect(g); g.connect(MASTER_GAIN || ctx.destination);
  src.start(t);
}
function playClap(ctx, t){
  [0, 0.012, 0.024].forEach(off => noiseHit(ctx, t+off, 0.09, 0.28, 1800));
}
function playTom(ctx, t){
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(90, t+0.2);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.32);
  o.connect(g); g.connect(MASTER_GAIN || ctx.destination);
  o.start(t); o.stop(t+0.34);
}
function playPerc(ctx, t){ noiseHit(ctx, t, 0.05, 0.18, 3200); }

function playGospelChoirPad(ctx, t){
  [220, 277.18, 329.63, 440].forEach((f,i)=> tone(ctx, f, t, 1.6, 'sine', 0.11 - i*0.01));
}
function playGospelOrganStab(ctx, t){
  [130.81, 164.81, 196.00, 261.63].forEach(f=> tone(ctx, f, t, 0.5, 'triangle', 0.14));

function playGospelClapStack(ctx, t){

function playGospelTambourine(ctx, t){

};

let SEQ_PATTERN = {};
SEQ_INSTRUMENTS.forEach(i=> SEQ_PATTERN[i.key] = Array(16).fill(0));
let SEQ_BPM = 96;
let SEQ_PLAYING = false;
let SEQ_STEP = 0;
let SEQ_TIMER = null;

function seqStepDurationMs(){ return (60/SEQ_BPM/4)*1000; }
function seqTick(){
  const ctx = ensureAudio();
  const t = ctx.currentTime + 0.02;
  SEQ_INSTRUMENTS.forEach(inst=>{
    if(SEQ_PATTERN[inst.key][SEQ_STEP]) inst.fn(ctx, t);
  });
  SEQ_STEP = (SEQ_STEP + 1) % 16;
  updateSeqPlayhead();
}
function updateSeqPlayhead(){
  document.querySelectorAll('.seq-step').forEach(el=>{
    el.classList.toggle('seq-current', parseInt(el.dataset.step,10) === SEQ_STEP);
  });
}
function seqPlay(){
  if(SEQ_PLAYING) return;
  ensureAudio();
  SEQ_PLAYING = true;
  SEQ_STEP = 0;
  seqTick();
  SEQ_TIMER = setInterval(seqTick, seqStepDurationMs());
}
function seqStop(){
  SEQ_PLAYING = false;
  if(SEQ_TIMER){ clearInterval(SEQ_TIMER); SEQ_TIMER = null; }
  SEQ_STEP = 0;
  updateSeqPlayhead();
}
function seqToggleStep(instKey, step){
  SEQ_PATTERN[instKey][step] = SEQ_PATTERN[instKey][step] ? 0 : 1;
}
function seqLoadPreset(name){
  const preset = SEQ_PRESETS[name] || {};
  SEQ_INSTRUMENTS.forEach(inst=>{
    SEQ_PATTERN[inst.key] = (preset[inst.key] ? preset[inst.key].slice() : Array(16).fill(0));
  });
}

/* ---- clavier synthé ---- */
const NOTE_FREQS = { 'C':261.63,'C#':277.18,'D':293.66,'D#':311.13,'E':329.63,'F':349.23,'F#':369.99,'G':392.00,'G#':415.30,'A':440.00,'A#':466.16,'B':493.88 };
const KEYBOARD_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let SYNTH_OCTAVE = 4;
let SYNTH_WAVE = 'sine';
function playSynthNote(note){
  const ctx = ensureAudio();
  if(!ctx) return;
  const octaveMult = Math.pow(2, SYNTH_OCTAVE - 4);
  const freq = NOTE_FREQS[note] * octaveMult;
  tone(ctx, freq, ctx.currentTime, 0.9, SYNTH_WAVE, 0.18);
}

/* ---- enregistreur vocal (micro) ---- */
let MEDIA_RECORDER = null;
let RECORDED_CHUNKS = [];
let RECORD_STREAM = null;
let RECORD_TIMER = null;
let RECORD_SECONDS = 0;
let RECORDED_BLOB_URL = null;

function micErrorMessage(e){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return "Ce navigateur ne permet pas l'accès au micro (essayez Chrome, Edge ou Safari récents, sur une page en https://).";
  }
  if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
    return "L'accès au micro exige une page en HTTPS (ou localhost). Une fois déployée sur GitHub Pages, l'adresse sera bien en https:// et ça fonctionnera.";
  }
  switch(e && e.name){
    case 'NotAllowedError': return "Micro refusé. Autorisez le micro pour ce site dans les réglages du navigateur (icône 🔒 ou 🎙️ dans la barre d'adresse), puis réessayez.";
    case 'NotFoundError': return "Aucun micro détecté sur cet appareil.";
    case 'NotReadableError': return "Le micro est déjà utilisé par une autre application.";
    case 'SecurityError': return "Accès au micro bloqué par ce contexte (iframe ou page non sécurisée). Cela doit fonctionner une fois déployé sur votre propre domaine en https://.";
    default: return "Micro indisponible ou refusé (" + (e && (e.name||e.message) || 'erreur inconnue') + ").";
  }
}
async function startRecording(){
  try{
    RECORD_STREAM = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    console.error('getUserMedia error', e);
    showToast(micErrorMessage(e));
    return false;
  }
  RECORDED_CHUNKS = [];
  try{
    MEDIA_RECORDER = new MediaRecorder(RECORD_STREAM);
  }catch(e){
    showToast("Format d'enregistrement non supporté par ce navigateur.");
    return false;
  }
  MEDIA_RECORDER.ondataavailable = (e)=>{ if(e.data.size>0) RECORDED_CHUNKS.push(e.data); };
  MEDIA_RECORDER.onstop = ()=>{
    const blob = new Blob(RECORDED_CHUNKS, {type:'audio/webm'});
    if(RECORDED_BLOB_URL) URL.revokeObjectURL(RECORDED_BLOB_URL);
    RECORDED_BLOB_URL = URL.createObjectURL(blob);
    if(RECORD_STREAM) RECORD_STREAM.getTracks().forEach(tr=>tr.stop());
    renderBeatmaking();
  };
  MEDIA_RECORDER.start();
  RECORD_SECONDS = 0;
  RECORD_TIMER = setInterval(()=>{ RECORD_SECONDS++; updateRecordTimer(); }, 1000);
  showToast('🎙️ Enregistrement en cours…');
  return true;
}
function stopRecording(){
  if(MEDIA_RECORDER && MEDIA_RECORDER.state !== 'inactive') MEDIA_RECORDER.stop();
  if(RECORD_TIMER){ clearInterval(RECORD_TIMER); RECORD_TIMER = null; }
}
function updateRecordTimer(){
  const el = document.getElementById('record-timer');
  if(el){
    const m = String(Math.floor(RECORD_SECONDS/60)).padStart(2,'0');
    const s = String(RECORD_SECONDS%60).padStart(2,'0');
    el.textContent = m+':'+s;
  }
}

/* ---- enregistreur du mix (batterie + clavier + ambiances) ---- */
let BEAT_RECORDER = null;
let BEAT_RECORDED_CHUNKS = [];
let BEAT_STREAM_DEST = null;
let BEAT_RECORD_TIMER = null;
let BEAT_RECORD_SECONDS = 0;
let BEAT_RECORDED_BLOB_URL = null;

function startBeatRecording(){
  const ctx = ensureAudio();
  if(!ctx){ showToast("Le son n'est pas disponible dans ce navigateur."); return false; }
  try{
    if(!BEAT_STREAM_DEST){
      BEAT_STREAM_DEST = ctx.createMediaStreamDestination();
      MASTER_GAIN.connect(BEAT_STREAM_DEST);
    }
    BEAT_RECORDED_CHUNKS = [];
    BEAT_RECORDER = new MediaRecorder(BEAT_STREAM_DEST.stream);
    BEAT_RECORDER.ondataavailable = (e)=>{ if(e.data.size>0) BEAT_RECORDED_CHUNKS.push(e.data); };
    BEAT_RECORDER.onstop = ()=>{
      const blob = new Blob(BEAT_RECORDED_CHUNKS, {type:'audio/webm'});
      if(BEAT_RECORDED_BLOB_URL) URL.revokeObjectURL(BEAT_RECORDED_BLOB_URL);
      BEAT_RECORDED_BLOB_URL = URL.createObjectURL(blob);
      renderBeatmaking();
    };
    BEAT_RECORDER.start();
    BEAT_RECORD_SECONDS = 0;
    BEAT_RECORD_TIMER = setInterval(()=>{ BEAT_RECORD_SECONDS++; updateBeatRecordTimer(); }, 1000);
    showToast('🔴 Enregistrement du mix — jouez votre rythme ou votre mélodie');
    return true;
  }catch(e){
    console.error('beat recorder error', e);
    showToast("Impossible d'enregistrer le mix sur ce navigateur.");
    return false;
  }
}
function stopBeatRecording(){
  if(BEAT_RECORDER && BEAT_RECORDER.state !== 'inactive') BEAT_RECORDER.stop();
  if(BEAT_RECORD_TIMER){ clearInterval(BEAT_RECORD_TIMER); BEAT_RECORD_TIMER = null; }
}
function updateBeatRecordTimer(){
  const el = document.getElementById('beat-record-timer');
  if(el){
    const m = String(Math.floor(BEAT_RECORD_SECONDS/60)).padStart(2,'0');
    const s = String(BEAT_RECORD_SECONDS%60).padStart(2,'0');
    el.textContent = m+':'+s;
  }
}

/* ================= toast ================= */
function showToast(msg){
  let t = document.getElementById('toast-el');
  if(!t){ t = document.createElement('div'); t.id='toast-el'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}

/* ================= favorites ================= */
function favKey(f){ return f.type+'|'+(f.compKey||'')+'|'+(f.groupId||'')+'|'+(f.idx!=null?f.idx:f.id); }
function isFavorited(f){ return FAVORITES.some(x=>favKey(x)===favKey(f)); }
async function toggleFavorite(f){
  if(isFavorited(f)){
    FAVORITES = FAVORITES.filter(x=>favKey(x)!==favKey(f));
    showToast('Retiré des favoris');
  } else {
    FAVORITES.unshift(f);
    showToast('Ajouté aux favoris ⭐');
  }
  await savePrefs();
}
function favStarHTML(f){
  return `<button class="fav-star ${isFavorited(f)?'active':''}" data-fav='${JSON.stringify(f).replace(/'/g,"&apos;")}'>${isFavorited(f)?'★':'☆'}</button>`;
}
function wireFavStars(){
  document.querySelectorAll('.fav-star').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const f = JSON.parse(btn.dataset.fav.replace(/&apos;/g,"'"));
      await toggleFavorite(f);
      btn.classList.toggle('active');
      btn.textContent = isFavorited(f) ? '★' : '☆';
    };
  });
}

function renderFavoris(){
  let html = `<h2 class="section-title">⭐ Mes favoris</h2>`;
  if(FAVORITES.length === 0){
    html += `<div class="card empty-state">Vous n'avez encore rien épinglé. L'étoile ☆ à côté d'un psaume, d'une prière ou d'un saint permet de le retrouver ici.</div>`;
  } else {
    html += `<div class="grid">${FAVORITES.map(f=>`
      <div class="card entry-card" data-fav-open='${JSON.stringify(f).replace(/'/g,"&apos;")}'>
        <div class="entry-avatar">${f.avatar||'⭐'}</div>
        <div class="entry-body">
          <p class="entry-name">${f.name}</p>
          <p class="entry-summary">${f.summary||''}</p>
        </div>
        ${favStarHTML(f)}
      </div>`).join('')}</div>`;
  }
  html += `<h2 class="section-title" style="margin-top:26px;">🕰️ Consultés récemment</h2>`;
  if(RECENT.length === 0){
    html += `<div class="card empty-state">Rien de récent pour l'instant.</div>`;
  } else {
    html += `<div class="grid">${RECENT.slice(0,12).map(f=>`
      <div class="card entry-card" data-fav-open='${JSON.stringify(f).replace(/'/g,"&apos;")}'>
        <div class="entry-avatar">${f.avatar||'📖'}</div>
        <div class="entry-body">
          <p class="entry-name">${f.name}</p>
          <p class="entry-summary">${f.summary||''}</p>
        </div>
      </div>`).join('')}</div>`;
  }
  document.getElementById('screen').innerHTML = html;
  wireFavStars();
  document.querySelectorAll('[data-fav-open]').forEach(c=>{
    c.onclick = (e)=>{
      if(e.target.closest('.fav-star')) return;
      const f = JSON.parse(c.dataset.favOpen.replace(/&apos;/g,"'"));
      if(f.type==='entry'){ PRIMARY = f.primary; SUBTAB[f.primary] = f.sub; GROUP_SEL[f.compKey] = f.groupId; ENTRY_OPEN = {compKey:f.compKey, groupId:f.groupId, idx:f.idx}; render(); }
      else if(f.type==='novena'){ goTo('prier','neuvaines'); OPEN_NOVENA = f.id; render(); }
    };
  });
}

function addToRecent(f){
  RECENT = RECENT.filter(x=>favKey(x)!==favKey(f));
  RECENT.unshift(f);
  RECENT = RECENT.slice(0,20);
  savePrefs();
}

/* ================= streak ================= */
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function markPrayedToday(){
  const t = todayISO();
  if(STREAK.lastDate === t){
    if(!PRAYED_DATES.includes(t)){ PRAYED_DATES.push(t); await savePrayedDates(PRAYED_DATES); }
    return;
  }
  const yest = new Date(); yest.setDate(yest.getDate()-1);
  const yestISO = yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');
  STREAK.count = (STREAK.lastDate === yestISO) ? STREAK.count+1 : 1;
  STREAK.lastDate = t;
  if(!PRAYED_DATES.includes(t)) PRAYED_DATES.push(t);
  PRAYED_DATES = PRAYED_DATES.slice(-370);
  await savePrefs();
  await savePrayedDates(PRAYED_DATES);
  checkStreakMilestone();
  checkBadges();
}
function streakCardHTML(){
  const prayedToday = STREAK.lastDate === todayISO();
  return `<div class="card streak-card">
    <span class="streak-flame">${STREAK.count>0?'🔥':'🕯️'}</span>
    <span class="streak-num">${STREAK.count}</span>
    <div class="streak-label">${STREAK.count>1?'jours de suite':'jour'}</div>
    <button class="btn ${prayedToday?'btn-ghost':'btn-primary'} btn-sm" id="prayed-today-btn" style="margin-top:10px;" ${prayedToday?'disabled':''}>${prayedToday?"Prié aujourd'hui ✓":"🕯️ J'ai prié aujourd'hui"}</button>
  </div>`;
}
function wireStreakButton(){
  const btn = document.getElementById('prayed-today-btn');
  if(btn) btn.onclick = async ()=>{ await markPrayedToday(); render(); };
}

/* ================= text-to-speech & share ================= */
function speakText(text){
  try{
    if(!window.speechSynthesis){ showToast("Lecture vocale indisponible sur ce navigateur"); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR';
    window.speechSynthesis.speak(u);
  }catch(e){ showToast("Lecture vocale indisponible"); }
}

/* ================= lecture vocale de la page entière ================= */
let READING_PAGE = false;
function extractScreenText(){
  const screen = document.getElementById('screen');
  if(!screen) return '';
  const clone = screen.cloneNode(true);
  clone.querySelectorAll('button, input, select, textarea, .chip-row, .subnav-row, iframe, audio, .loop-grid, .seq-transport, .preset-row').forEach(el=> el.remove());
  return clone.innerText.replace(/\s+/g,' ').trim();
}
function toggleReadPage(){
  const btn = document.getElementById('read-page-btn');
  if(!window.speechSynthesis){ showToast("Lecture vocale indisponible sur ce navigateur"); return; }
  if(READING_PAGE){
    window.speechSynthesis.cancel();
    READING_PAGE = false;
    if(btn){ btn.textContent = '🔊'; btn.classList.remove('tool-active'); }
    return;
  }
  const text = extractScreenText();
  if(!text){ showToast("Rien à lire sur cet écran"); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.slice(0, 6000));
  u.lang = 'fr-FR';
  u.onend = ()=>{ READING_PAGE = false; if(btn){ btn.textContent='🔊'; btn.classList.remove('tool-active'); } };
  u.onerror = u.onend;
  window.speechSynthesis.speak(u);
  READING_PAGE = true;
  if(btn){ btn.textContent = '⏹'; btn.classList.add('tool-active'); }
  showToast('🔊 Lecture de la page…');
}

function artistInitial(name){ return name.trim()[0].toUpperCase(); }
function artistColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return ARTIST_COLORS[Math.abs(hash) % ARTIST_COLORS.length];
}

/* extrait un ID YouTube depuis une URL classique, pour convertir les liens externes existants */
function extractYoutubeId(url){
  if(!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

    };
  });
}

async function shareText(title, text){
  try{
    if(navigator.share){ await navigator.share({title, text}); return; }
  }catch(e){}
  try{ await navigator.clipboard.writeText(title+'\n\n'+text); showToast('Copié dans le presse-papiers 📋'); }
  catch(e){ showToast("Impossible de copier"); }
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let curY = y;
  const lines = [];
  words.forEach(word=>{
    const test = line + word + ' ';
    if(ctx.measureText(test).width > maxWidth && line !== ''){
      lines.push(line); line = word + ' ';
    } else { line = test; }
  });
  lines.push(line);
  lines.forEach(l=>{ ctx.fillText(l.trim(), x, curY); curY += lineHeight; });
  return curY;
}
function generateShareImage(title, text){
  const canvas = document.createElement('canvas');
  canvas.width = 800; canvas.height = 800;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,800,800);
  grad.addColorStop(0, '#5E1622'); grad.addColorStop(1, '#7C1F2E');
  ctx.fillStyle = grad; ctx.fillRect(0,0,800,800);
  ctx.strokeStyle = 'rgba(228,199,126,0.6)'; ctx.lineWidth = 3;
  ctx.strokeRect(30,30,740,740);
  ctx.fillStyle = '#E4C77E'; ctx.font = '40px Georgia, serif'; ctx.textAlign='center';
  ctx.fillText('✦', 400, 130);
  ctx.fillStyle = '#FBF7EC'; ctx.font = 'italic 30px Georgia, serif'; ctx.textAlign = 'center';
  wrapCanvasText(ctx, '« '+text+' »', 400, 260, 620, 42);
  ctx.fillStyle = '#E4C77E'; ctx.font = 'bold 22px Georgia, serif';
  ctx.fillText('— ' + title, 400, 680);
  ctx.fillStyle = 'rgba(251,247,236,0.6)'; ctx.font = '16px Arial, sans-serif';
  ctx.fillText('Lumen — prier chaque jour', 400, 750);
  return canvas;
}
function openShareImage(title, text){
  const canvas = generateShareImage(title, text);
  const overlay = document.getElementById('share-image-overlay');
  const holder = document.getElementById('share-canvas-holder');
  holder.innerHTML = '';
  canvas.id = 'share-canvas';
  holder.appendChild(canvas);
  overlay.classList.remove('hidden');
  document.getElementById('download-image-btn').onclick = ()=>{
    canvas.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'lumen-'+todayISO()+'.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  };
}

/* ================= rosary (chapelet interactif) ================= */
function renderRosary(){
  if(!ROSARY_STATE){
    ROSARY_STATE = { setKey: todaysRosarySet(), phase:'intro', mysteryIdx:0, beadCount:0 };
  }
  const set = ROSARY_SETS[ROSARY_STATE.setKey];
  let html = `<h2 class="section-title">🔗 Chapelet</h2>`;
  html += `<div class="chip-row">${Object.keys(ROSARY_SETS).map(k=>
    `<button class="chip ${ROSARY_STATE.setKey===k?'active':''}" data-set="${k}">${ROSARY_SETS[k].label}</button>`
  ).join('')}</div>`;
  html += `<p class="section-desc">${set.days} — ${set.label.toLowerCase()}</p>`;

  if(ROSARY_STATE.phase === 'intro'){
    html += `<div class="card">
      <p class="entry-detail-text">Signe de croix, puis Je crois en Dieu (Credo), un Notre Père, trois Je vous salue Marie (pour la foi, l'espérance et la charité), et un Gloire au Père.</p>
      <div style="text-align:center; margin-top:10px;"><button class="btn btn-primary btn-sm" id="rosary-start">Commencer les mystères →</button></div>
    </div>`;
  } else if(ROSARY_STATE.phase === 'mystery'){
    const mi = ROSARY_STATE.mysteryIdx;
    html += `<div class="step-progress">${set.mysteres.map((_,i)=>`<span class="${i<mi?'done':i===mi?'current':''}"></span>`).join('')}</div>`;
    html += `<div class="card">
      <p class="eyebrow" style="color:var(--gold);">${mi+1}${mi===0?'er':'e'} mystère</p>
      <p class="day-title">${set.mysteres[mi]}</p>
      <p class="entry-detail-text">Un Notre Père, dix Je vous salue Marie, un Gloire au Père. Égrenez les dizaines en avançant le compteur ci-dessous.</p>
      <div class="bead-counter">
        <button class="btn btn-ghost btn-sm" id="bead-minus">−</button>
        <span class="bead-num">${ROSARY_STATE.beadCount}<span style="font-size:16px;color:var(--ink-soft);">/10</span></span>
        <button class="btn btn-ghost btn-sm" id="bead-plus">+</button>
      </div>
      <div class="bead-dots">${Array.from({length:10}).map((_,i)=>`<span class="bead-dot ${i<ROSARY_STATE.beadCount?'done':''}"></span>`).join('')}</div>
      <div style="text-align:center;"><button class="btn btn-primary btn-sm" id="mystery-next">${mi<4?'Mystère suivant →':'Terminer →'}</button></div>
    </div>`;
  } else if(ROSARY_STATE.phase === 'done'){
    html += `<div class="card" style="text-align:center;">
      <p class="day-title">Chapelet achevé ✦</p>
      <p class="entry-detail-text">Terminez par le Salve Regina, en confiant à Marie ce qui vous tient à cœur aujourd'hui.</p>
      <button class="btn btn-ghost btn-sm" id="rosary-restart">Recommencer</button>
    </div>`;
  }
  document.getElementById('screen').innerHTML = html;
  document.querySelectorAll('.chip').forEach(c=> c.onclick = ()=>{ ROSARY_STATE.setKey = c.dataset.set; render(); });
  const startBtn = document.getElementById('rosary-start');

    html += `<textarea id="examen-notes" rows="3" placeholder="${EXAMEN_MODE==='matin'?"Une intention pour aujourd'hui (optionnel)":"Votre résolution pour demain (optionnel)"}">${EXAMEN_STATE.notes}</textarea>`;
  }
  html += `<div style="text-align:center; margin-top:8px;">
        ${EXAMEN_STATE.step>0?'<button class="btn btn-ghost btn-sm" id="examen-prev" style="margin-right:8px;">← Précédent</button>':''}
        <button class="btn btn-primary btn-sm" id="examen-next">${EXAMEN_STATE.step<steps.length-1?'Suivant →':'Terminer'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.cal-toggle button').forEach(b=>{
    b.onclick = ()=>{ EXAMEN_MODE = b.dataset.mode; EXAMEN_STATE = {step:0, notes:''}; render(); };

  const prevBtn = document.getElementById('examen-prev');
  if(prevBtn) prevBtn.onclick = ()=>{ EXAMEN_STATE.step--; render(); };
  document.getElementById('examen-next').onclick = async ()=>{
    const notesEl = document.getElementById('examen-notes');
    if(notesEl) EXAMEN_STATE.notes = notesEl.value;
    if(EXAMEN_STATE.step < steps.length-1){ EXAMEN_STATE.step++; render(); }
    else {
      await markPrayedToday();
      if(EXAMEN_STATE.notes.trim()){
        const label = EXAMEN_MODE==='matin' ? "☀️ Examen du matin — " : "🌙 Examen du soir — ";
        JOURNAL.unshift({id:'j-'+Date.now(), text:label+EXAMEN_STATE.notes.trim(), createdAt:Date.now()});
        await saveJournal(JOURNAL);
      }
      EXAMEN_STATE = { step:0, notes:'' };
      showToast(EXAMEN_MODE==='matin' ? 'Journée offerte ☀️' : 'Examen terminé 🌙');
      goTo('espace','journal');
    }

}

  }

  let html = `<h2 class="section-title">❓ Quiz de connaissances</h2>

    <div class="card">
      <p class="day-title" style="font-size:16px;">${q.q}</p>
      ${q.options.map((opt,i)=>{
        let cls = 'quiz-option';
        if(QUIZ_STATE.answered){
          if(i===q.correct) cls += ' correct';
          else if(i===QUIZ_STATE.selected) cls += ' wrong';
        }
        return `<button class="${cls}" data-i="${i}" ${QUIZ_STATE.answered?'disabled':''}>${opt}</button>`;
      }).join('')}
      ${QUIZ_STATE.answered ? `<p class="section-desc" style="margin-top:8px;">${q.explain}</p><div style="text-align:center;"><button class="btn btn-primary btn-sm" id="quiz-next">Question suivante →</button></div>` : ''}
    </div>`;
  document.getElementById('screen').innerHTML = html;
  if(!QUIZ_STATE.answered){
    document.querySelectorAll('.quiz-option').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.i,10);
        QUIZ_STATE.selected = i;
        QUIZ_STATE.answered = true;
        if(i===q.correct) QUIZ_STATE.score++;
        render();
      };
    });
  } else {
    document.getElementById('quiz-next').onclick = ()=>{ QUIZ_STATE.idx++; QUIZ_STATE.answered=false; QUIZ_STATE.selected=null; render(); };
  }
}

/* ================= upcoming novenas & liturgical color (home helpers) ================= */
function daysUntil(mmdd){
  const [mm,dd] = mmdd.split('-').map(Number);
  const now = new Date(); now.setHours(0,0,0,0);
  let target = new Date(now.getFullYear(), mm-1, dd);
  if(target < now) target = new Date(now.getFullYear()+1, mm-1, dd);
  return Math.round((target-now)/86400000);
}
function upcomingNovenasHTML(){
  const items = Object.entries(NOVENA_FEASTS).map(([id,mmdd])=>{
    const nov = NOVENAS.find(n=>n.id===id);
    if(!nov) return null;
    const daysToFeast = daysUntil(mmdd);
    const startIn = daysToFeast - 9;
    return {nov, daysToFeast, startIn};
  }).filter(Boolean).sort((a,b)=>a.daysToFeast-b.daysToFeast).slice(0,3);
  if(items.length===0) return '';
  return `<h2 class="section-title">📅 Neuvaines à venir</h2><div class="card">` +
    items.map(it => `<div class="upcoming-item">
      <span>${it.nov.title}</span>
      <span class="upcoming-days">${it.startIn > 0 ? `dans ${it.startIn} j.` : 'à commencer maintenant'}</span>
    </div>`).join('') + `</div>`;
}

  const v = VERSETS_DU_JOUR[dayOfYear() % VERSETS_DU_JOUR.length];

/* ================= bible reader (shell) ================= */
function renderBibleReader(){
  const readAT = BIBLE_BOOKS_AT.filter(b=>BIBLE_PROGRESS.includes(b.split('|')[0])).length;
  const readNT = BIBLE_BOOKS_NT.filter(b=>BIBLE_PROGRESS.includes(b.split('|')[0])).length;
  let html = `<h2 class="section-title">📗 Lire la Bible</h2>
    <p class="section-desc">L'index complet des 73 livres de la Bible. Chaque livre ouvre une lecture complète (traduction Louis Segond, domaine public) sur Bible Gateway. Cochez un livre une fois lu pour suivre votre progression.</p>`;
  BIBLE_TESTAMENTS.forEach(t=>{
    const readCount = t.id==='ancien' ? readAT : readNT;
    const pct = Math.round(readCount/t.books.length*100);
    html += `<h2 class="section-title" style="font-size:16px;">${t.title} — ${readCount}/${t.books.length}</h2>
      <div class="bible-progress-bar"><div class="bible-progress-fill" style="width:${pct}%;"></div></div>
      <div class="grid">`;
    t.books.forEach(b=>{
      const [fr, en] = b.split('|');
      const url = "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(en+" 1") + "&version=LSG";
      const isRead = BIBLE_PROGRESS.includes(fr);
      html += `<div class="card entry-card" style="align-items:center;">
        <input type="checkbox" class="bible-check" data-book="${fr}" ${isRead?'checked':''}>
        <div class="entry-avatar">📖</div>
        <div class="entry-body" style="flex:1;"><p class="entry-name">${fr}</p><a href="${url}" target="_blank" rel="noopener" class="entry-summary" style="display:block;">Lire sur Bible Gateway (Louis Segond) ↗</a></div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('screen').innerHTML = html;
  document.querySelectorAll('.bible-check').forEach(cb=>{
    cb.onclick = async ()=>{
      const book = cb.dataset.book;
      if(cb.checked){ if(!BIBLE_PROGRESS.includes(book)) BIBLE_PROGRESS.push(book); }
      else { BIBLE_PROGRESS = BIBLE_PROGRESS.filter(b=>b!==book); }
      await saveBibleProgress(BIBLE_PROGRESS);
      render();
    };
  });
}

function renderOfficeDuJour(){
  if(!OFFICE_STATE){ OFFICE_STATE = { step:0 }; }
  const steps = ['verset','psaume','examen','intention','fin'];
  const cur = steps[OFFICE_STATE.step];
  let html = `<h2 class="section-title">🕯️ Office du jour</h2>
    <p class="section-desc">Un parcours court qui enchaîne verset, psaume, examen éclair et intention — pour prier sans avoir à choisir où aller.</p>
    <div class="step-progress">${steps.slice(0,4).map((_,i)=>`<span class="${i<OFFICE_STATE.step?'done':i===OFFICE_STATE.step?'current':''}"></span>`).join('')}</div>
    <div class="card">`;
  if(cur==='verset'){
    const v = VERSETS_DU_JOUR[dayOfYear() % VERSETS_DU_JOUR.length];
    html += `<p class="eyebrow" style="color:var(--gold);">1. Verset du jour</p><p class="verset-text">« ${v.text} »</p><p class="verset-ref">${v.ref}</p>`;
  } else if(cur==='psaume'){
    const themeIdx = dayOfYear() % PSALM_GROUPS.length;
    const group = PSALM_GROUPS[themeIdx];
    const p = group.entries[dayOfYear() % group.entries.length];
    html += `<p class="eyebrow" style="color:var(--gold);">2. Psaume</p><p class="day-title">${p.name}</p><p class="entry-detail-text">${p.summary}</p>`;
  } else if(cur==='examen'){
    html += `<p class="eyebrow" style="color:var(--gold);">3. Examen éclair</p><p class="entry-detail-text">Prenez trente secondes de silence. Une seule question : de quoi ai-je le plus besoin de parler à Dieu, là, maintenant ?</p>`;
  } else if(cur==='intention'){
    html += `<p class="eyebrow" style="color:var(--gold);">4. Une intention</p><p class="entry-detail-text">Nommez, même intérieurement, une personne ou une situation à confier à Dieu aujourd'hui.</p>
      <textarea id="office-intention" rows="2" placeholder="Écrire cette intention (optionnel)"></textarea>`;
  } else {
    html += `<p class="day-title" style="text-align:center;">Office terminé ✦</p><p class="entry-detail-text" style="text-align:center;">Que cette courte prière accompagne le reste de votre journée.</p>`;
  }
  html += `<div style="text-align:center; margin-top:10px;">
      <button class="btn btn-primary btn-sm" id="office-next">${OFFICE_STATE.step<4?'Suivant →':'Recommencer'}</button>
    </div></div>`;
  document.getElementById('screen').innerHTML = html;
  document.getElementById('office-next').onclick = async ()=>{
    const intentEl = document.getElementById('office-intention');
    if(intentEl && intentEl.value.trim()){
      INTENTIONS.unshift({id:'i-'+Date.now(), name:'Anonyme', text:intentEl.value.trim(), prayers:0, createdAt:Date.now()});
      await saveIntentions(INTENTIONS);
    }
    if(OFFICE_STATE.step<4){ OFFICE_STATE.step++; render(); }
    else { await markPrayedToday(); OFFICE_STATE=null; showToast('Office terminé ✦'); render(); }
  };
}

/* ================= calendrier Avent / Carême interactif ================= */
function renderAventCareme(){
  const banner = computeLiturgicalSeasonBanner();
  const today = new Date(); today.setHours(0,0,0,0);
  let startDate, totalDays, label;
  if(banner.includes('Avent')){
    startDate = adventStart(today.getMonth()===11 && today.getDate()>=25 ? today.getFullYear() : (today.getMonth()===11?today.getFullYear():today.getFullYear()-(today.getMonth()<10?0:0)));
    // find the advent start that is <= today and closest
    let y = today.getFullYear();
    let cand = adventStart(y);
    if(cand > today) cand = adventStart(y-1);
    startDate = cand;
    totalDays = 25; label = "Calendrier de l'Avent";
  } else if(banner.includes('Carême')){
    const easter = getEasterDate(today.getMonth()<6 ? today.getFullYear() : today.getFullYear()+1);
    startDate = addDays(easter, -46);
    totalDays = 40; label = "Calendrier du Carême";
  } else {
    document.getElementById('screen').innerHTML = `<h2 class="section-title">🕯️ Avent / Carême</h2>
      <div class="card empty-state">Ce calendrier interactif s'active pendant l'Avent et le Carême. Revenez à ce moment-là — en attendant, l'onglet Calendrier vous indique le temps liturgique actuel.</div>`;
    return;
  }
  const dayIndex = Math.floor((today - startDate)/86400000);
  let html = `<h2 class="section-title">🕯️ ${label}</h2>
    <p class="section-desc">Ouvrez la case du jour pour une courte méditation. Les cases précédentes restent accessibles.</p>
    <div class="advent-grid">`;
  for(let i=1;i<=totalDays;i++){
    const isOpen = ADVENT_PROGRESS[i];
    const isAvailable = i <= dayIndex+1;
    let cls = 'advent-door';
    if(isOpen) cls += ' opened'; else if(!isAvailable) cls += ' locked';
    html += `<div class="${cls}" data-day="${i}" data-available="${isAvailable}">${i}</div>`;
  }
  html += `</div>`;
  if(ADVENT_PROGRESS._open){
    const i = ADVENT_PROGRESS._open;
    const medit = MEDITATIONS[(i+dayOfYear()) % MEDITATIONS.length];
    html += `<div class="card"><p class="eyebrow" style="color:var(--gold);">Jour ${i}</p><p class="saint-name">${medit.title}</p><p class="entry-detail-text">${medit.text}</p></div>`;
  }
  document.getElementById('screen').innerHTML = html;
  document.querySelectorAll('.advent-door').forEach(door=>{
    door.onclick = async ()=>{
      if(door.dataset.available !== 'true') return;
      const i = parseInt(door.dataset.day,10);
      ADVENT_PROGRESS[i] = true;
      ADVENT_PROGRESS._open = i;
      await saveAdventProgress(ADVENT_PROGRESS);
      await markPrayedToday();
      render();
    };
  });
}

function playBell(){
  const ctx = ensureAudio();
  if(!ctx) return;
  const t = ctx.currentTime;
  [523.25, 659.25, 784.00].forEach((freq, i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.2/(i+1), t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+2.4);
    o.connect(g); g.connect(MASTER_GAIN || ctx.destination);
    o.start(t); o.stop(t+2.5);
  });
}
function checkReminders(){
  const now = new Date();
  const hm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  [['morning',"☀️ C'est l'heure de votre prière du matin"], ['midi',"🔔 C'est l'heure de l'Angélus"], ['evening',"🌙 C'est l'heure de votre prière du soir"]].forEach(([key,msg])=>{
    if(REMINDERS[key] && REMINDERS[key]===hm && checkReminders._last!==hm+key){
      if(key === 'midi') playBell();
      if(window.Notification && Notification.permission === 'granted'){
        new Notification('Lumen', {body: msg});
      }
      checkReminders._last = hm+key;
    }
  });
}

/* ================= export calendrier (.ics) ================= */
function icsDate(d){
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
function exportICS(){
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Lumen//FR'];
  Object.entries(NOVENA_FEASTS).forEach(([id,mmdd])=>{
    const nov = NOVENAS.find(n=>n.id===id);
    if(!nov) return;
    const [mm,dd] = mmdd.split('-').map(Number);
    const now = new Date(); now.setHours(0,0,0,0);
    let feast = new Date(now.getFullYear(), mm-1, dd);
    if(feast < now) feast = new Date(now.getFullYear()+1, mm-1, dd);
    const start = addDays(feast, -9);
    lines.push('BEGIN:VEVENT');
    lines.push('UID:lumen-'+id+'-'+icsDate(start)+'@lumen.app');
    lines.push('DTSTART;VALUE=DATE:'+icsDate(start));
    lines.push('DTEND;VALUE=DATE:'+icsDate(addDays(start,1)));
    lines.push('SUMMARY:Début de la '+nov.title);
    lines.push('DESCRIPTION:Neuvaine de neuf jours menant à la fête du '+feast.toLocaleDateString('fr-FR'));
    lines.push('END:VEVENT');
  });
  CALENDRIER.forEach(g=>{
    g.entries.forEach(e=>{
      if(!e.dates) return;
      const parsed = new Date(e.dates.replace(/^\S+ /,''));
      // try simple parse via Date constructor with French month names won't work; skip if invalid
      if(isNaN(parsed)) return;
      lines.push('BEGIN:VEVENT');
      lines.push('UID:lumen-fete-'+e.name.replace(/\W+/g,'-')+'@lumen.app');
      lines.push('DTSTART;VALUE=DATE:'+icsDate(parsed));
      lines.push('DTEND;VALUE=DATE:'+icsDate(addDays(parsed,1)));
      lines.push('SUMMARY:'+e.name);
      lines.push('END:VEVENT');
    });
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lumen-calendrier.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Calendrier exporté 📆');
}

/* ================= global search ================= */
function buildSearchIndex(){
  const idx = [];
  function addGroups(groups, primary, sub, compKey){
    groups.forEach(g=>{
      (g.entries||[]).forEach((e,i)=>{
        idx.push({name:e.name, summary:e.summary, avatar:e.avatar, primary, sub, compKey, groupId:g.id, idx:i});
      });
    });
  }
  addGroups(PSALM_GROUPS, 'ecritures','psaumes','ecritures:psaumes');
  addGroups(HISTORY, 'ecritures','bible','ecritures:bible');
  addGroups(RECITS_GROUPS.filter(g=>!g.special && !g.diagram), 'ecritures','recits','ecritures:recits');
  addGroups(JESUS, 'ecritures','jesus','ecritures:jesus');
  addGroups(SAINTS_LIBRARY, 'eglise','saints','eglise:saints');
  addGroups(EGLISE, 'eglise','vie-eglise','eglise:vie-eglise');
  addGroups(ACTUALITES, 'eglise','actualites','eglise:actualites');
  addGroups(SPIRITUALITE, 'sagesse','spiritualite','sagesse:spiritualite');
  addGroups(ENSEIGNEMENTS_ALL, 'sagesse','enseignements','sagesse:enseignements');
  addGroups(PRIERES, 'prier','prieres','prier:prieres');
  SAINTS.forEach(s=> idx.push({name:s.name, summary:s.bio, avatar:'🕊️', primary:'eglise', sub:'calendrier', isCalSaint:true}));
  return idx;
}
let SEARCH_INDEX = null;
function runSearch(query){
  if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
  const q = query.trim().toLowerCase();
  if(q.length < 2) return [];
  return SEARCH_INDEX.filter(item =>
    item.name.toLowerCase().includes(q) || (item.summary||'').toLowerCase().includes(q)
  ).slice(0, 30);
}
function renderSearchResults(query){
  const results = runSearch(query);
  const box = document.getElementById('search-results');
  if(!query.trim()){ box.innerHTML = '<p class="section-desc">Tapez au moins deux lettres pour chercher un psaume, un saint, une prière…</p>'; return; }
  if(results.length===0){ box.innerHTML = '<p class="section-desc">Aucun résultat pour cette recherche.</p>'; return; }
  box.innerHTML = results.map((r,i)=>`<div class="search-result-item" data-idx="${i}">
    <div class="entry-avatar" style="width:32px;height:32px;font-size:14px;">${r.avatar||'📖'}</div>
    <div><p class="search-result-name">${r.name}</p><p class="search-result-meta">${r.sub||''}</p></div>
  </div>`).join('');
  box.querySelectorAll('.search-result-item').forEach(el=>{
    el.onclick = ()=>{
      const r = results[parseInt(el.dataset.idx,10)];
      closeSearch();
      if(r.isCalSaint){ goTo('eglise','calendrier'); return; }
      PRIMARY = r.primary; SUBTAB[r.primary] = r.sub;
      GROUP_SEL[r.compKey] = r.groupId;
      ENTRY_OPEN = { compKey:r.compKey, groupId:r.groupId, idx:r.idx };
      render();
    };
  });
}

let THEME_MODE = 'auto';

function computeAutoTheme(){
  const h = new Date().getHours();
  if(h>=5 && h<8) return 'soleil';
  if(h>=8 && h<17) return 'light';
  if(h>=17 && h<20) return 'ocean';
  if(h>=20 && h<23) return 'dark';
  return 'minuit';
}
function applyThemeAndFont(){
  if(THEME_MODE === 'auto') THEME = computeAutoTheme();
  document.body.setAttribute('data-theme', THEME);
  const current = THEMES_LIST.find(t=>t.key===THEME) || THEMES_LIST[0];
  const btn = document.getElementById('theme-btn');
  if(btn) btn.textContent = THEME_MODE === 'auto' ? '🔄' : current.icon;
  const app = document.getElementById('app');
  app.classList.remove('font-sm','font-md','font-lg');
  app.classList.add('font-'+FONT_SIZE);
  app.classList.toggle('dyslexic-font', DYSLEXIC_FONT);
  app.style.filter = BRIGHTNESS !== 100 ? `brightness(${BRIGHTNESS}%)` : '';
  if(CUSTOM_ACCENT){
    app.style.setProperty('--wine', CUSTOM_ACCENT);
    app.style.setProperty('--wine-dark', shadeColor(CUSTOM_ACCENT, -25));
    app.style.setProperty('--gold', CUSTOM_ACCENT);
  } else {
    app.style.removeProperty('--wine');
    app.style.removeProperty('--wine-dark');
    app.style.removeProperty('--gold');
  }
}
function shadeColor(hex, percent){
  const num = parseInt(hex.replace('#',''), 16);
  let r = (num >> 16) + Math.round(255 * (percent/100));
  let g = ((num >> 8) & 0x00FF) + Math.round(255 * (percent/100));
  let b = (num & 0x0000FF) + Math.round(255 * (percent/100));
  r = Math.max(0, Math.min(255, r));
  g = Math.max(0, Math.min(255, g));
  b = Math.max(0, Math.min(255, b));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}

  };
  const resetAccentBtn = document.getElementById('reset-accent-btn');
  if(resetAccentBtn){
    resetAccentBtn.onclick = async ()=>{
      CUSTOM_ACCENT = '';
      applyThemeAndFont();
      await savePrefs();
      showToast('Couleur d\u2019origine restaurée');
      openThemePicker();
    };
  }
  overlay.classList.remove('hidden');
}
async function changeFontSize(delta){
  const order = ['sm','md','lg'];
  let i = order.indexOf(FONT_SIZE);
  i = Math.max(0, Math.min(order.length-1, i+delta));
  FONT_SIZE = order[i];
  applyThemeAndFont();
  await savePrefs();
}

/* ================= onboarding ================= */
let ONBOARD_IDX = 0;
function renderOnboarding(){
  const slide = ONBOARDING_SLIDES[ONBOARD_IDX];
  const content = document.getElementById('onboard-content');
  content.innerHTML = `
    <p class="onboard-title">${slide.icon} ${slide.title}</p>
    <p class="entry-detail-text">${slide.text}</p>
    <div class="onboard-dots">${ONBOARDING_SLIDES.map((_,i)=>`<span class="${i===ONBOARD_IDX?'active':''}"></span>`).join('')}</div>
    <div style="display:flex; justify-content:space-between;">
      <button class="btn btn-ghost btn-sm" id="onboard-skip">Passer</button>
      <button class="btn btn-primary btn-sm" id="onboard-next">${ONBOARD_IDX<ONBOARDING_SLIDES.length-1?'Suivant →':"C'est parti ✦"}</button>
    </div>
  `;
  document.getElementById('onboard-skip').onclick = closeOnboarding;
  document.getElementById('onboard-next').onclick = ()=>{
    if(ONBOARD_IDX < ONBOARDING_SLIDES.length-1){ ONBOARD_IDX++; renderOnboarding(); }
    else closeOnboarding();
  };
}
async function closeOnboarding(){
  document.getElementById('onboarding-overlay').classList.add('hidden');
  ONBOARDING_SEEN = true;
  await savePrefs();
}

/* ================= résumé du jour (à l'ouverture) ================= */
function renderDailySummary(){
  const {saint} = getSaintOfDay();
  const colorKey = todaysLiturgicalColor();
  const color = LITURGICAL_COLORS[colorKey];
  const v = VERSETS_DU_JOUR[dayOfYear() % VERSETS_DU_JOUR.length];
  const content = document.getElementById('summary-content');
  content.innerHTML = `
    <p class="onboard-title">✦ ${frenchDate()}</p>
    <div class="liturgical-badge" style="justify-content:center;">
      <span class="liturgical-dot" style="background:${color.hex};"></span>
      <span class="liturgical-text"><b>${color.label}</b></span>
    </div>
    <p class="entry-detail-text" style="text-align:center; margin-bottom:6px;"><b>${saint.name}</b></p>
    <p class="verset-text" style="font-size:15px;">« ${v.text} »</p>
    <p class="verset-ref" style="text-align:center;">${v.ref}</p>

    <div style="text-align:center; margin-top:10px;">
