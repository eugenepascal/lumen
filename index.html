async function closeDailySummary(){
  document.getElementById('summary-overlay').classList.add('hidden');
  LAST_SUMMARY_SEEN = todayISO();
  await savePrefs();
}

/* ================= breadcrumb ================= */
function renderBreadcrumb(){
  const bar = document.getElementById('breadcrumb-bar');
  if(PRIMARY === 'accueil'){ bar.innerHTML = ''; return; }
  const primaryLabel = (PRIMARY_TABS.find(t=>t.key===PRIMARY)||{}).label || '';
  const subs = SUBNAV[PRIMARY];
  const sub = subs ? subs.find(s=>s.key===(SUBTAB[PRIMARY]||subs[0].key)) : null;
  let trail = `${primaryLabel}`;
  if(sub) trail += ` › ${sub.label.replace(/^[^\s]+\s/,'')}`;
  if(ENTRY_OPEN){
    const groups = { 'ecritures:psaumes':PSALM_GROUPS,'ecritures:bible':HISTORY,'ecritures:recits':RECITS_GROUPS,'ecritures:jesus':JESUS,
      'eglise:saints':SAINTS_LIBRARY,'eglise:vie-eglise':EGLISE,'eglise:actualites':ACTUALITES,'sagesse:spiritualite':SPIRITUALITE,
      'sagesse:enseignements':ENSEIGNEMENTS_ALL,'prier:prieres':PRIERES,'eglise:calendrier':CALENDRIER }[ENTRY_OPEN.compKey];
    const g = groups && groups.find(x=>x.id===ENTRY_OPEN.groupId);
    if(g) trail += ` › <b>${g.title}</b>`;
  }
  bar.innerHTML = `<span>${trail}</span>`;
}

let LAST_SCREEN_KEY = '';
function render(){
  document.body.dataset.section = PRIMARY;
  document.getElementById('date-line').textContent = frenchDate();
  renderTabbar();
  renderScreen();
  const subnavHTML = renderSubnavHTML();
  if(subnavHTML){
    document.getElementById('screen').insertAdjacentHTML('afterbegin', subnavHTML);
    wireSubnav();
  }
  renderBreadcrumb();
  wireFavStars();
  wireSpeakShare();
  wireStreakButton();
  wireVideoLinks();
  syncBgAmbianceIcon();

  const screenKey = PRIMARY + ':' + (SUBTAB[PRIMARY]||'') + ':' + (ENTRY_OPEN ? ENTRY_OPEN.compKey+ENTRY_OPEN.idx : '');
  if(screenKey !== LAST_SCREEN_KEY){
    const screenEl = document.getElementById('screen');
    if(screenEl) screenEl.scrollTop = 0;
    if(READING_PAGE){
      window.speechSynthesis.cancel();
      READING_PAGE = false;
      const rpBtn = document.getElementById('read-page-btn');
      if(rpBtn){ rpBtn.textContent = '🔊'; rpBtn.classList.remove('tool-active'); }
    }
    LAST_SCREEN_KEY = screenKey;
  }

  if(ENTRY_OPEN){
    const groups = { 'ecritures:psaumes':PSALM_GROUPS,'ecritures:bible':HISTORY,'ecritures:recits':RECITS_GROUPS,'ecritures:jesus':JESUS,
      'eglise:saints':SAINTS_LIBRARY,'eglise:vie-eglise':EGLISE,'eglise:actualites':ACTUALITES,'sagesse:spiritualite':SPIRITUALITE,
      'sagesse:enseignements':ENSEIGNEMENTS_ALL,'prier:prieres':PRIERES,'eglise:calendrier':CALENDRIER }[ENTRY_OPEN.compKey];
    const g = groups && groups.find(x=>x.id===ENTRY_OPEN.groupId);
    const entry = g && g.entries[ENTRY_OPEN.idx];
    if(entry){
      addToRecent({type:'entry', primary:PRIMARY, sub:SUBTAB[PRIMARY], compKey:ENTRY_OPEN.compKey, groupId:ENTRY_OPEN.groupId, idx:ENTRY_OPEN.idx, name:entry.name, avatar:entry.avatar, summary:(entry.summary||'').slice(0,90)});
    }
  }
}

/* ---------- init ---------- */
async function startApp(){
  document.getElementById('screen').innerHTML = '<div class="loading"><svg class="loading-emblem" viewBox="0 0 24 24"><defs><linearGradient id="flameGrad3" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7C1F2E"/><stop offset="55%" stop-color="#B8863B"/><stop offset="100%" stop-color="#FFF3C4"/></linearGradient></defs><path fill="url(#flameGrad3)" d="M12 2c-2.2 4-6 6.2-6 11a6 6 0 0 0 12 0c0-2.1-1-3.4-2-4.4.4 2-1 3-1 3 .6-3.2-1.1-5.4-3-9.6z"/></svg>Un instant, on allume les lumières…</div>';
  const [p, ints, jour, prefs, privInts, bibleProg, memorial, objectifs, adventProg, reminders, companions, savedBeat, parcoursProg, gratitude, confessionDate, prayedDates, homeLayout, groupCode, caremeProg, histoire, souvenirs] = await Promise.all([loadProgress(), loadIntentions(), loadJournal(), loadPrefsAndData(), loadPrivateIntentions(), loadBibleProgress(), loadMemorial(), loadObjectifs(), loadAdventProgress(), loadReminders(), loadNovenaCompanions(), loadBeatPattern(), loadParcoursProgress(), loadGratitude(), loadConfessionDate(), loadPrayedDates(), loadHomeLayout(), loadPrayerGroup(), loadCaremeProgress(), loadHistoire(), loadSouvenirs()]);
  PROGRESS = p;
  INTENTIONS = ints;
  JOURNAL = jour;
  PRIVATE_INTENTIONS = privInts;
  BIBLE_PROGRESS = bibleProg;
  MEMORIAL = memorial;
  OBJECTIFS = objectifs;
  ADVENT_PROGRESS = adventProg;
  REMINDERS = reminders;
  NOVENA_COMPANIONS = companions;
  PARCOURS_PROGRESS = parcoursProg || { completedDays: [] };
  CAREME_PROGRESS = caremeProg || { completedDays: [] };
  GRATITUDE_ENTRIES = gratitude || [];
  HISTOIRE_ENTRIES = histoire || [];
  SOUVENIRS = souvenirs || [];
  LAST_CONFESSION = confessionDate || '';
  PRAYED_DATES = prayedDates || [];
  HOME_LAYOUT = homeLayout;
  PRAYER_GROUP_CODE = groupCode || '';
  if(PRAYER_GROUP_CODE){ GROUP_INTENTIONS = await loadGroupIntentions(PRAYER_GROUP_CODE); }
  if(savedBeat && savedBeat.pattern){
    SEQ_INSTRUMENTS.forEach(inst=>{
      if(savedBeat.pattern[inst.key]) SEQ_PATTERN[inst.key] = savedBeat.pattern[inst.key];
    });
    if(savedBeat.bpm) SEQ_BPM = savedBeat.bpm;
  }
  FAVORITES = prefs.favorites || [];
  RECENT = prefs.recent || [];
  STREAK = prefs.streak || {count:0,lastDate:null};
  THEME = prefs.theme || 'light';
  THEME_MODE = prefs.themeMode || 'auto';
  FONT_SIZE = prefs.fontSize || 'md';
  DYSLEXIC_FONT = !!prefs.dyslexicFont;
  BRIGHTNESS = prefs.brightness || 100;
  CUSTOM_ACCENT = prefs.customAccent || '';
  ONBOARDING_SEEN = !!prefs.onboardingSeen;
  SEEN_MILESTONES = prefs.seenMilestones || [];
  LAST_SUMMARY_SEEN = prefs.lastSummarySeen || '';
  USER_NAME = prefs.userName || (CURRENT_USER && CURRENT_USER.displayName ? CURRENT_USER.displayName.split(' ')[0] : '');
  const prevOpenDate = prefs.lastOpenDate || '';
  if(prevOpenDate && prevOpenDate !== todayISO()){
    DAYS_SINCE_LAST_OPEN = Math.floor((new Date(todayISO()) - new Date(prevOpenDate)) / 86400000);
  }
  LAST_OPEN_DATE = todayISO();
  savePrefs();

  applyThemeAndFont();
  render();

  document.getElementById('refuge-btn').onclick = openRefuge;
  document.getElementById('refuge-overlay').onclick = (e)=>{ if(e.target.id==='refuge-overlay') closeRefuge(); };
  setInterval(checkReminders, 30000);

  document.getElementById('search-btn').onclick = openSearch;
  document.getElementById('search-close').onclick = closeSearch;
  document.getElementById('search-input').oninput = (e)=> renderSearchResults(e.target.value);
  document.getElementById('search-overlay').onclick = (e)=>{ if(e.target.id==='search-overlay') closeSearch(); };
  document.getElementById('theme-btn').onclick = toggleTheme;
  document.getElementById('bg-ambiance-btn').onclick = toggleBgAmbiance;
  document.getElementById('bg-yt-close').onclick = ()=>{ stopBgYoutube(); syncBgAmbianceIcon(); showToast('Ambiance arrêtée'); };
  document.getElementById('ambiance-picker-close').onclick = closeAmbiancePicker;
  document.getElementById('video-modal-close').onclick = closeVideoModal;
  document.getElementById('video-modal-overlay').onclick = (e)=>{ if(e.target.id==='video-modal-overlay') closeVideoModal(); };
  document.getElementById('ambiance-picker-overlay').onclick = (e)=>{ if(e.target.id==='ambiance-picker-overlay') closeAmbiancePicker(); };
  document.getElementById('read-page-btn').onclick = toggleReadPage;
  document.getElementById('font-minus-btn').onclick = ()=> changeFontSize(-1);
  document.getElementById('font-plus-btn').onclick = ()=> changeFontSize(1);
  document.getElementById('share-image-close').onclick = ()=> document.getElementById('share-image-overlay').classList.add('hidden');
  document.getElementById('share-image-overlay').onclick = (e)=>{ if(e.target.id==='share-image-overlay') e.currentTarget.classList.add('hidden'); };

  const voiceBtn = document.getElementById('voice-search-btn');
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRec){
    voiceBtn.onclick = ()=>{
      const rec = new SpeechRec();
      rec.lang = 'fr-FR'; rec.interimResults = false; rec.maxAlternatives = 1;
      voiceBtn.textContent = '🔴';
      rec.onresult = (e)=>{
        const text = e.results[0][0].transcript;
        document.getElementById('search-input').value = text;
        renderSearchResults(text);
        voiceBtn.textContent = '🎤';
      };
      rec.onerror = ()=>{ voiceBtn.textContent = '🎤'; showToast("Recherche vocale indisponible"); };
      rec.onend = ()=>{ voiceBtn.textContent = '🎤'; };
      rec.start();
    };
  } else {
    voiceBtn.style.display = 'none';
  }

  if(!ONBOARDING_SEEN){
    document.getElementById('onboarding-overlay').classList.remove('hidden');
    ONBOARD_IDX = 0;
    renderOnboarding();
  } else if(LAST_SUMMARY_SEEN !== todayISO()){
    renderDailySummary();
    document.getElementById('summary-overlay').classList.remove('hidden');
  }
}

startAuthFlow();
